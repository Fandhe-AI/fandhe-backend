# docs-site 生成器の wrapper crate。fandhe-frontend 本体（FF_REV で固定した shallow checkout の
# `_ff/`）の docs-site クレートを path 依存で呼び出す。外部 crate（crates.io）への依存は
# 持たない。path 依存の先も外部 crate ゼロであることを実測済みのため、ビルド時に
# レジストリへ接続しない（匿名・隔離環境でも通る）。
#
# `[workspace]` の空テーブルは必須。無いと cargo が親ディレクトリの workspace
# （対象リポジトリのルート `Cargo.toml` 等）に所属しようとして失敗する。
[package]
name = "docs-site-gen"
version = "0.0.0"
edition = "2021"
publish = false
# 対象リポジトリの tools/docs-site-gen/build.rs が自動検出されてビルド時に実行されるのを防ぐ
# （この wrapper はビルドスクリプトを持たない）。
build = false

[dependencies]
fandhe-frontend-docs-site = { path = "../../_ff/crates/docs-site" }

[workspace]
