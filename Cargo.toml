# fandhe-backend の cargo workspace ルート定義（仮想 workspace）。
#
# TASK-1.1（docs/spec/05-tasks.md）時点のクレート分割方針:
#   - crates/core    : 最小コア（HTTP/1.1 パーサ・3 拡張点 Middleware/UpgradeHandler/RequestGate）。
#                       依存 0 件を維持し、重い依存・プラグイン固有シンボルを持ち込まない
#                       （pay-for-what-you-use、.claude/rules/pay-for-what-you-use.md）。
#   - crates/http    : HTTP プリミティブ（TASK-1.3 以降で追加）。core から呼ばれる下位層
#   - crates/routes  : ルーティング（TASK-1.5、#14 で新設）。依存方向は
#                       `server` → `routes` → `http::*` の一方向であり、
#                       `scripts/dep-direction-check.sh` が機械的に保証する
#   - crates/plugin-*: websocket / graphql / openapi / webrtc / hub-wiring / tracing。
#                       Cargo feature + `dep:` 構文で着脱可能にし、無効時は依存・コード・
#                       unsafe をゼロにする（TASK-2.1 以降）
#   - crates/axum-ref: axum を性能・フットプリント比較の参照実装として運用する（TASK-1.2）
#
# 上記のうち crates/core 以外は本タスク（TASK-1.1）時点では未作成。
# `members` は `crates/*` glob とし、以降のタスクでクレートを追加した際に
# 本ファイルの変更なしに workspace へ自動的に組み込まれるようにする。
[workspace]
resolver = "3"
members = ["crates/*"]
# `crates/http/fuzz` は cargo-fuzz 専用クレート（TASK-15.3-1、#87）。libFuzzer
# ハーネス（`libfuzzer-sys`）は nightly のサニタイザ計装が前提で stable ビルドに
# 参加できず、ここへ含めると本体の `cargo build` / `cargo tree` / バイナリに
# fuzz 専用依存が混入してしまう（pay-for-what-you-use 違反、
# .claude/rules/pay-for-what-you-use.md）。`scripts/fuzz.sh` が独立
# workspace として `cargo +<pinned-nightly> fuzz` 経由でのみビルド・実行する。
#
# `crates/plugin-webrtc/tests-e2e` は `RebindHandle::rebind` 経由の実接続
# force-close e2e テスト専用クレート（イシュー #507）。core（`webrtc` feature）と
# plugin-webrtc を同時に参照するため、root workspace に含めると `cargo metadata`
# の resolve グラフ上で core → plugin-webrtc の依存が常時可視となり
# pay-for-what-you-use 検証（`scripts/pay-for-what-you-use-check.sh` (c) `cargo
# geiger` 検証）を偽陽性 FAIL させる（PR #506）。同じく独立 workspace として
# `scripts/webrtc-e2e.sh` 経由でのみビルド・実行する。
#
# `benches/microbench` は決定的マイクロベンチ（per-request alloc カウンタ、
# イシュー #615）専用クレート。上記 2 クレートと同じ理由（root workspace の
# `cargo metadata`/`cargo tree`/`cargo geiger` へ計測専用依存
# （`stats_alloc`・`serde_json`）を混入させず、公開 13 クレートの依存グラフに
# 一切影響させない）で独立 workspace 化する。`benches/microbench.sh` 経由での
# みビルド・実行する（CI は `.github/workflows/ci.yml` の `microbench` ジョブ）。
exclude = ["crates/http/fuzz", "crates/plugin-webrtc/tests-e2e", "benches/microbench", "benches/refs"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Fandhe-AI/fandhe-backend"
# lockstep バージョニング（docs/design/crates-io-release.md 7 節）の一元管理点
# （イシュー #452）。公開対象 13 クレート（http / routes / core / plugin-* 10 種）と
# 恒久非公開 3 クレート（axum-ref / docs-site / ws-load-client）はすべて
# `version.workspace = true` でこの値を継承する。次回バンプはこの 1 行 +
# 下記 `[workspace.dependencies]` の `version` 値のみを書き換えればよい
# （`crates/http/fuzz` は独立 workspace のため対象外、本ファイル冒頭のコメント参照）。
version = "0.4.0"

# workspace 内 path 依存の一元管理点（イシュー #452）。公開対象 13 クレート
# （http / routes / core / plugin-* 10 種）を内部依存として参照する各クレートの
# Cargo.toml は `{ workspace = true }`（optional なものは
# `{ workspace = true, optional = true }`）でここを継承し、`path = "../.."` +
# `version = "0.4.0"` 併記の重複記述を排除する。バンプ時は本表の 13 行の
# `version` 値を上記 `[workspace.package] version` と揃えて書き換える
# （`crates/plugin-hub-wiring` の dev-dependency `fandhe-backend-routes` は
# publish 時に strip される dev 専用の version なし path 依存であり、公開
# 成果物の内容を変えないため意図的に本表へ含めない）。
[workspace.dependencies]
fandhe-backend-http = { path = "crates/http", version = "0.4.0" }
fandhe-backend-routes = { path = "crates/routes", version = "0.4.0" }
fandhe-backend-core = { path = "crates/core", version = "0.4.0" }
fandhe-backend-plugin-compression = { path = "crates/plugin-compression", version = "0.4.0" }
fandhe-backend-plugin-cors = { path = "crates/plugin-cors", version = "0.4.0" }
fandhe-backend-plugin-graphql = { path = "crates/plugin-graphql", version = "0.4.0" }
fandhe-backend-plugin-hub-wiring = { path = "crates/plugin-hub-wiring", version = "0.4.0" }
fandhe-backend-plugin-openapi = { path = "crates/plugin-openapi", version = "0.4.0" }
fandhe-backend-plugin-static = { path = "crates/plugin-static", version = "0.4.0" }
fandhe-backend-plugin-tracing = { path = "crates/plugin-tracing", version = "0.4.0" }
fandhe-backend-plugin-webrtc = { path = "crates/plugin-webrtc", version = "0.4.0" }
fandhe-backend-plugin-webrtc-proxy = { path = "crates/plugin-webrtc-proxy", version = "0.4.0" }
fandhe-backend-plugin-websocket = { path = "crates/plugin-websocket", version = "0.4.0" }

# workspace 全体の lint 既定値。各クレートの Cargo.toml で
# `[lints] workspace = true` を指定して継承する。
# `unsafe_code = "warn"` は CI の `cargo clippy -- -D warnings` と組み合わせることで
# 実質 deny として機能し、意図しない unsafe の混入を早期に検知する
# （.claude/rules/coding-rust.md・.claude/rules/security.md）。
# `missing_docs = "warn"` も同様に CI の `cargo clippy -- -D warnings` で
# 実質 deny となるが、rustdoc 固有 lint（intra-doc リンク切れ等）は clippy では
# 検査されないため、CI に独立の `doc` ジョブ（`RUSTDOCFLAGS=-D warnings` での
# `cargo doc`）を追加し、doc コメント網羅率・整合性の両方を機械強制する
# （TASK-11.2-2、docs/spec/05-tasks.md、#76）。値自体は spec の
# `#![warn(missing_docs)]` 準拠のまま `warn` を維持し、ローカルの反復開発を
# 阻害しない安全側の判断とする。
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
# `unsafe fn` 内でも `unsafe {}` ブロックを明示させる（TASK-14.2、#40、REQ-14）。
# edition 2024 のデフォルトは既に deny だが、workspace lints 表に明記して
# 将来 edition が変わっても意図が読み取れるようにする。
unsafe_op_in_unsafe_fn = "deny"

# 危険な `unsafe` パターンをビルド段階で機械的にブロックする多層防御（TASK-14.2、#40、
# REQ-14、PoC-9: docs/spec/03-poc/ai-first-maintainability/README.md）。
# 選定根拠・2 層設計の詳細は docs/design/unsafe-deny-lints.md を参照。
#
# 第 1 層（forbid）: メモリ安全性を直接壊す correctness 系。clippy デフォルトで既に deny だが、
# `forbid` へ昇格することで `#[allow(...)]` によるコード側での抑制自体をコンパイルエラーにする。
# PoC-9 が指摘した「AI が `#[allow]` を書いて CI を素通りする」経路を封じるのが目的で、
# CI の `-D warnings` のみに依存しない多層防御を成す。
[workspace.lints.clippy]
uninit_vec = "forbid"
uninit_assumed_init = "forbid"
mem_replace_with_uninit = "forbid"
transmuting_null = "forbid"
wrong_transmute = "forbid"
unsound_collection_transmute = "forbid"
eager_transmute = "forbid"
cast_slice_different_sizes = "forbid"
zst_offset = "forbid"
out_of_bounds_indexing = "forbid"
not_unsafe_ptr_arg_deref = "forbid"

# 第 2 層（deny）: `unsafe` の記述規律を強制する restriction 系。原則禁止だが、
# 局所的な `#[allow(...)]` + コードレビューでの正当化により例外化しうる
# （forbid 層と異なり `#[allow]` 自体は許容する）。
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
multiple_unsafe_ops_per_block = "deny"

# 計測用リリースプロファイル（TASK-1.2、docs/spec/03-poc/fullscratch-performance/axum-ref
# と同条件の `lto = true`）。`benches/*.sh` は `cargo build --release` の成果物を対象に
# RPS・RSS・起動時間・バイナリサイズを計測するため、workspace 全体（axum-ref・将来の
# フルスクラッチコア）に同一のリリース最適化条件を適用し、比較のノイズ要因を減らす。
[profile.release]
lto = true
