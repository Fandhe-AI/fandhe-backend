<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>fandhe-backend ToDo テンプレート</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
  li { display: flex; align-items: center; gap: 0.5rem; margin: 0.25rem 0; }
  li span { flex: 1; }
  li.done span { text-decoration: line-through; color: #888; }
  form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  input[type="text"] { flex: 1; padding: 0.4rem; }
  button { cursor: pointer; }
</style>
</head>
<body>
<h1>ToDo</h1>
<form id="create-form">
  <input id="title-input" type="text" placeholder="やること" required />
  <button type="submit">追加</button>
</form>
<ul id="todo-list"></ul>

<script>
// 依存なしの素の fetch のみで /todos API（templates/app/src/main.rs 参照）を
// 叩く最小 UI。フレームワーク・ビルドツールを介さない、テンプレート単体
// 完結のサンプルであることを優先する。
const listEl = document.getElementById("todo-list");
const formEl = document.getElementById("create-form");
const inputEl = document.getElementById("title-input");

async function fetchTodos() {
  const res = await fetch("/todos");
  const todos = await res.json();
  renderTodos(todos);
}

function renderTodos(todos) {
  listEl.innerHTML = "";
  for (const todo of todos) {
    const li = document.createElement("li");
    li.className = todo.done ? "done" : "";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = todo.done;
    checkbox.addEventListener("change", () => toggleDone(todo));

    const span = document.createElement("span");
    span.textContent = todo.title;

    const deleteButton = document.createElement("button");
    deleteButton.textContent = "削除";
    deleteButton.addEventListener("click", () => deleteTodo(todo));

    li.append(checkbox, span, deleteButton);
    listEl.append(li);
  }
}

async function toggleDone(todo) {
  await fetch(`/todos/${todo.id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ done: !todo.done }),
  });
  await fetchTodos();
}

async function deleteTodo(todo) {
  await fetch(`/todos/${todo.id}`, { method: "DELETE" });
  await fetchTodos();
}

formEl.addEventListener("submit", async (event) => {
  event.preventDefault();
  const title = inputEl.value.trim();
  if (!title) return;
  await fetch("/todos", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title }),
  });
  inputEl.value = "";
  await fetchTodos();
});

fetchTodos();
</script>
</body>
</html>
