[package]
name = "actix-ref"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "actix-web を横並び性能比較用の参照実装として運用するバイナリ（benches/bench-compare.sh）"

# `crates/axum-ref` と同じ責務境界: 比較専用バイナリであり、ここで追加する依存は
# root workspace（core・plugin-*）へ一切波及しない（`benches/refs/Cargo.toml` 参照）。
# actix-web は現行安定版 4 系を採用する（2026-08 時点 4.15）。
[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
