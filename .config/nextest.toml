# TASK-11.4（#36）: CI テストタイムアウト設定。
#
# 背景（PoC-9 事例、docs/spec/05-tasks.md TASK-11.4・docs/spec/04-requirements.md NFR-10）:
# オフバイワンのバグがテスト失敗ではなく `cargo test` の「ハング」として現れる事例が
# 確認されている。stable ツールチェーン（rust-toolchain.toml で固定）では
# `cargo test` 単体にテスト単位のタイムアウトを持たせられないため、CI のテストランナーを
# cargo-nextest に切り替え、本ファイルでテスト単位のハング検知を規定する。
# ローカルでも `cargo nextest run` を使えば CI と同一のタイムアウト条件で再現できる。
#
# nextest は doc test を実行しないため、doc test（.claude/rules/coding-rust.md で必須化）は
# `.github/workflows/ci.yml` 側で `cargo test --doc` として別ステップで維持する。

[profile.default]
# 60 秒経過で「slow」警告を出し、以後 60 秒ごとに追加の period を消費する。
# 2 period（= 120 秒）経過したテストは強制終了（SIGTERM）して失敗（TIMEOUT）扱いにする。
# self-hosted runner の負荷変動による誤検知を避けるため、PoC-9 で観測された 60 秒より
# 安全側（2 倍）に設定している。
slow-timeout = { period = "60s", terminate-after = 2 }

# イシュー #276: `peer_connection_slot_is_released_after_close_allowing_reuse`
# （crates/plugin-webrtc）はテスト内部でポーリング予算 120 秒（`SLOT_RELEASE_BUDGET`）を
# 持つため、既定の slow-timeout（60s × terminate-after 2 = 120s で SIGTERM）とほぼ衝突し、
# ローカル実行でも TIMEOUT キルが発生しうる。このテストに限定して period を延長する
# （テスト内予算 120 秒 + セットアップ・後処理の余裕）。
[[profile.default.overrides]]
filter = 'package(fandhe-backend-plugin-webrtc) and test(=peer_connection_slot_is_released_after_close_allowing_reuse)'
slow-timeout = { period = "150s", terminate-after = 1 }

# CI 実行用プロファイル（[profile.default] を継承）。
# 本設定の目的はハング型退行の検知であり、1 件のテスト失敗で残りのテスト結果が
# 得られなくなるのを避けるため、CI では fail-fast を無効化して全テストの結果を収集する。
[profile.ci]
fail-fast = false

# イシュー #276: 実ネットワーク越し ICE/DTLS クローズ検知時間のばらつき（環境要因）のみを
# 吸収する限定 retry。対象は当該 1 テストに限定し、実装回帰（枠解放漏れ）の決定的な検知は
# `handler::tests::close_handler_releases_slot_when_state_becomes_closed`
# （crates/plugin-webrtc/src/handler.rs）が担う。retry で握りつぶさない。
# override の継承挙動（[profile.default] 側の override が [profile.ci] にも及ぶか）は
# nextest のバージョンに依存しうるため、挙動に依存せず安全側に倒すべく
# ここでも同じ slow-timeout を明記する。
[[profile.ci.overrides]]
filter = 'package(fandhe-backend-plugin-webrtc) and test(=peer_connection_slot_is_released_after_close_allowing_reuse)'
retries = 2
slow-timeout = { period = "150s", terminate-after = 1 }
