[graph]
all-features = true

[advisories]
# RustSec advisory DB による既知脆弱性検知（OWASP A06、.claude/rules/security.md）。
# ignore は空を維持し、無視が必要になった場合は理由コメント付きで追加する
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-3-Clause",
]
confidence-threshold = 0.8
