[package]
name = "fandhe-backend-example-with-graphql"
version = "0.1.0"
edition = "2024"
description = "fandhe-backend の GraphQL プラグイン（graphql feature）の配線（Server::graphql へのスキーマ登録 + POST /graphql の最小クエリ実行）だけを見せる最小サンプル（examples/with-graphql、examples/README.md 参照）。"
license = "MIT OR Apache-2.0"
publish = false

# 依存は path 指定（リポジトリ内 workspace の crates/* を直接参照し、CI で
# 常に最新実装に対して検証する）。本サンプルをリポジトリ外へコピーして
# 使う場合は `path = "../../crates/..."` を外し、`version = "0.2.0"` のみの
# crates.io 版参照に切り替えること（crates.io 公開済み、CLAUDE.md Overview
# 節参照。`templates/app/Cargo.toml` と同一の注意）。
[dependencies]
# 見せたい機能（GraphQL）に必要な feature のみ有効化する。他 feature
# （cors / compression / static / openapi 等）は本サンプルの焦点外のため
# 有効化しない（pay-for-what-you-use、.claude/rules/pay-for-what-you-use.md）。
fandhe-backend-core = { version = "0.2.0", path = "../../crates/core", features = [
    "graphql",
] }
fandhe-backend-http = { version = "0.2.0", path = "../../crates/http" }
fandhe-backend-routes = { version = "0.2.0", path = "../../crates/routes" }
fandhe-backend-plugin-graphql = { version = "0.2.0", path = "../../crates/plugin-graphql" }
# `async_graphql::dynamic`（`Schema::build` による実行時スキーマ構築 API）を
# 本体コード（src/main.rs）で直接使うため、テスト専用にとどまらず通常
# 依存として `dynamic-schema` feature を有効化する（`crates/plugin-graphql`
# の `[dev-dependencies]` コメントと同一理由）。`#[Object]` 派生マクロは
# 使わない（生成コードが workspace の forbid lint と衝突するため、
# `crates/plugin-graphql/src/lib.rs` crate doc 参照。本サンプルは
# standalone workspace で forbid lint を継承しないが、一貫性のため同方針とする）。
async-graphql = { version = "7", default-features = false, features = [
    "dynamic-schema",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }

# root workspace（リポジトリ直下 Cargo.toml の members）から意図的に切り離す。
# examples/with-graphql は「フレームワーク利用者へ配布される独立サンプルの
# 雛形」であり、root workspace に巻き込まれると独立プロジェクトとしての
# `cargo build`/`cargo test` の挙動を検証できなくなる（templates/app/Cargo.toml
# と同一理由）。root Cargo.toml の `members` は `crates/*` glob のため、本
# ディレクトリは変更なしに非メンバーのままになる（`cargo metadata` で確認済み）。
[workspace]
members = ["."]
