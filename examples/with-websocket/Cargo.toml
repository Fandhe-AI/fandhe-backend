[package]
name = "fandhe-backend-example-with-websocket"
version = "0.1.0"
edition = "2024"
description = "fandhe-backend の WebSocket プラグイン（websocket feature）における WebSocketConfig::with_handler によるユーザー定義メッセージハンドラ配線だけを見せる最小サンプル（examples/with-websocket、examples/README.md 参照）。"
license = "MIT OR Apache-2.0"
publish = false

# 依存は path 指定（リポジトリ内 workspace の crates/* を直接参照し、CI で
# 常に最新実装に対して検証する）。本サンプルをリポジトリ外へコピーして
# 使う場合は `path = "../../crates/..."` を外し、`version = "0.4.0"` のみの
# crates.io 版参照に切り替えること（当該バージョンの crates.io publish 完了後に限る。公開状況は CLAUDE.md Overview
# 節参照。`examples/with-cors/Cargo.toml` と同一の注意）。
[dependencies]
# 見せたい機能（WebSocket）に必要な feature のみ有効化する。他 feature
# （cors / compression / static / openapi 等）は本サンプルの焦点外のため
# 有効化しない（pay-for-what-you-use、.claude/rules/pay-for-what-you-use.md）。
#
# プラグインクレートへの直接依存は持たない。`websocket` feature 経由で
# `fandhe_backend_core::plugin_websocket` として再エクスポートされる
# （イシュー #421・#435）ため、`main.rs` は core 経由のパスのみを参照する。
fandhe-backend-core = { version = "0.4.0", path = "../../crates/core", features = [
    "websocket",
] }
fandhe-backend-http = { version = "0.4.0", path = "../../crates/http" }
fandhe-backend-routes = { version = "0.4.0", path = "../../crates/routes" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
# `WsMessageHandler::on_message` の戻り値 `BoxFuture` を組み立てるために
# 必要（`crates/plugin-websocket` 自身が同じ理由で依存しているのと同一）。
futures-util = { version = "0.3", default-features = false, features = [
    "std",
] }

# テスト専用（`cargo test` 時のみビルドされ、配布バイナリの依存には現れない）。
# ハンドシェイク・メッセージ往復の E2E テストで実クライアント側フレーミングを
# 組み立てるために使う（`crates/plugin-websocket/tests/handler_e2e.rs` と
# 同一バージョン系）。
[dev-dependencies]
tokio = { version = "1", features = [
    "net",
    "io-util",
    "macros",
    "rt-multi-thread",
    "time",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }

# root workspace（リポジトリ直下 Cargo.toml の members）から意図的に切り離す。
# examples/with-websocket は「フレームワーク利用者へ配布される独立サンプルの
# 雛形」であり、root workspace に巻き込まれると独立プロジェクトとしての
# `cargo build`/`cargo test` の挙動を検証できなくなる（examples/with-cors と
# 同一理由）。root Cargo.toml の `members` は `crates/*` glob のため、本
# ディレクトリは変更なしに非メンバーのままになる（`cargo metadata` で確認済み）。
[workspace]
members = ["."]
