name: standalone-crates-io

# イシュー #371: templates/*・examples/* の standalone クレートが「path 指定を
# 外してリポジトリ外へコピーした場合に crates.io 公開版（0.1.0）だけでビルド・
# テストできるか」を機械検証する（scripts/standalone-crates-io-check.sh 参照）。
#
# なぜ ci.yml へ相乗りさせず別 workflow にするか（bench-schedule.yml と同一の
# 設計判断）:
#   ci.yml の pull_request トリガーには paths フィルタがなく、ジョブを追加すると
#   templates/examples に無関係な全 PR で crates.io からのダウンロード + 全
#   standalone クレートのフルビルドが毎回走り、無関係 PR の CI 時間を恒常的に
#   延ばす（旧 self-hosted 時代は runner 負荷抑制方針との衝突。ホステッドでも
#   無駄なジョブ実行を避ける原則として維持、.claude/rules/ci.md）。paths フィルタ付き pull_request + 週次
#   schedule の独立 workflow に分離することで、関係する変更時と定期検証のみに
#   実行を絞る。ci.yml の日次 schedule（dep-audit のみ走らせる方針）にも負荷を
#   追加しない。
#
# この分離の帰結として、本チェックは ci.yml の ci-complete 集約ゲート
# （required status check、docs/design/ci-completion-criteria.md）の対象外となる。
# templates/examples 変更 PR では独立チェックとして PR 上に表示され、失敗すれば
# 可視だがマージ強制力はない（required 化は #371 のスコープ外）。
#
# cron 配置（.claude/rules/ci.md「schedule 系ワークフロー同士は cron をずらして
# 負荷を分散する」）: update-external.yml（00:00 UTC 日次）・ci.yml（00:30 UTC
# 日次）・bench-schedule.yml（日曜 02:00 UTC 週次）と重ならない
# `0 2 * * 6`（土曜 02:00 UTC = 11:00 JST、週次）を使う。crates.io 公開版との
# 乖離は PR を伴わずに（公開版 yank 等でも）生じうるため、PR トリガーだけでなく
# 定期実行でも検知する。

on:
  pull_request:
    branches: [main]
    paths:
      - "templates/**"
      - "examples/**"
      - "scripts/standalone-crates-io-check.sh"
      - ".github/workflows/standalone-crates-io.yml" # 自己参照パターン（docs-site.yml と同様）
  schedule:
    - cron: "0 2 * * 6"
  workflow_dispatch: {}

permissions:
  contents: read # 最小権限（.claude/rules/ci.md・A01/A05 対策）

concurrency:
  group: standalone-crates-io-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone-crates-io:
    name: standalone クレートの crates.io 依存のみビルド検証
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #554）。
    runs-on: ubuntu-latest
    # standalone クレートごとの crates.io 依存ダウンロード + フルビルド + テストを
    # 直列実行する（共有 target/ を使わないコールドビルド）。ハングしたジョブの
    # 無期限実行を防ぐ上限（.claude/rules/ci.md「全ジョブに timeout-minutes を
    # 設定する」多層防御。runner 種別に依らず維持する運用ルール）。
    timeout-minutes: 45
    steps:
      - name: Checkout
        # ci.yml 各ジョブと同一 SHA で固定する（サプライチェーン考慮、
        # .claude/rules/security.md）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#554）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （ci.yml の各ジョブと同一方針・同一 SHA、イシュー #551 で確立）。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: standalone-crates-io-check.sh（path 除去 → crates.io 依存のみで build/test）
        run: bash scripts/standalone-crates-io-check.sh
