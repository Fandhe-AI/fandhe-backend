name: Codex PR review

# Fandhe-AI/actions の reusable workflow（workflow_call 版）を @latest で呼び出す
# 薄い wrapper。かつて本ファイルにあった実装本体（codex exec 直接実行・多層防御）は
# Fandhe-AI/actions#9・#10 で同リポジトリへ移設した（本リポジトリ側の置換はイシュー #529）。
# 設計経緯・多層防御の詳細コメントは移設先 .github/workflows/codex-review.yml と
# codex-review/README.md を参照。
# レビュー制御ファイル（.github/codex/prompts/review.md・.github/codex/review-schema.json・
# AGENTS.md「レビュー基準」節）は本リポジトリに残し、引き続き PR の base コミット参照で使う。

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

# reusable workflow のトップレベル concurrency は機能しないため呼び出し側で設定する
concurrency:
  group: codex-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex-review:
    uses: Fandhe-AI/actions/.github/workflows/codex-review.yml@latest
    permissions:
      contents: read
      pull-requests: write
    with:
      # update-external.yml が生成する日次同期 PR は上流の取り込みそのもので、
      # codex の指摘があってもこの PR では直せない（修正先は取り込み元の上流リポジトリ）。
      # 判定はブランチ名の接頭辞のみで行うため、push できる主体は該当接頭辞の
      # ブランチで gate を回避できる（受容済み残留リスク。第三者の write
      # コラボレーターがいる場合は指定しないこと）。接頭辞は自動生成 PR 専用の
      # 十分に限定的な値にする（区切り文字の "-" まで含める）。
      skip-branch-prefixes: chore/skills-update-,chore/submodule-update-
      # 既定値と同値だが、no-sudo（汎用防御ラベル）→ codex（用途ラベル）への変更点
      # （親 #528 で確定）を明示するため省略しない。codex 実行ジョブは codex-home
      # 方式の認証情報を self-hosted runner 上に配置する構成のため、public 化後も
      # 組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md §3）が認める唯一の self-hosted 例外
      # として維持する（イシュー #555。fork PR は reusable workflow 側が fail-closed
      # で実行を拒否する多層防御が前提）。
      runner-label: codex
      # PR コメント投稿ジョブは資格情報に触れないため self-hosted 例外の対象外。
      # 既定値が self-hosted のため、public リポジトリでは組織 runner 方針
      # （Fandhe-AI/actions リポジトリの docs/runner-policy.md §3/§4・
      # codex-review/templates/codex-review.public.yml）
      # に従い ubuntu-latest を明示的に渡す（イシュー #555。既定値への暗黙依存の解消）。
      post-feedback-runner-label: ubuntu-latest
