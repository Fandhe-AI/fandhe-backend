name: Codex PR review

# Codex CLI（codex exec 直接実行）による PR 自動レビュー。
# openai/codex-action は使わない: 同 action は openai-api-key 未指定だと Responses API proxy
# が起動せず server info ファイルが書かれない一方、Read server info ステップは prompt 指定
# だけでも実行されるため、codex exec 前に必ず失敗する（v1 の pin SHA
# 52fe01ec の action.yml / src/readServerInfo.ts で確認済み）。ChatGPT ログイン済み
# CODEX_HOME を使う本方式では CLI を直接叩く必要がある。呼び出し形（stdin プロンプト +
# --output-last-message + --output-schema）は同 action の src/runCodexExec.ts と同一。
# - レビュー基準はリポジトリルート AGENTS.md「レビュー基準（Codex PR 自動レビュー）」節。
#   prompt（.github/codex/prompts/review.md）が `git show HEAD^1:AGENTS.md` で
#   ベースブランチ側の内容を明示的に読ませる（Codex の cwd 自動読込機能に頼ると
#   checkout（PR 側）の AGENTS.md を読んでしまい、下記の自己参照問題が AGENTS.md にも
#   及ぶため使わない）
# - 指摘は `--output-schema`（.github/codex/review-schema.json）で構造化 JSON に固定し、
#   gate は 2 段で判定する: (1) `review_completed == true` の確認（fail-closed。runner の
#   sandbox 制約等でレビュー手順自体を完遂できなかった場合に findings 空の正常系 JSON が
#   返り P0/P1 gate だけが素通りする fail-open を防ぐ、イシュー #524／親 #523） →
#   (2) P0/P1 指摘が 1 件でもあれば jq 判定してジョブを失敗させる
# - レビュー制御用ファイル（prompt: .github/codex/prompts/review.md・schema:
#   .github/codex/review-schema.json、および上記の AGENTS.md「レビュー基準」節）は
#   PR の checkout 内容から直接消費せず、`git show <base-sha>:<path>` で PR の base
#   コミット（信頼済み参照。fork PR はそもそも実行しないため main への push 権限を
#   持つ者のみが更新できる）から取得したものを使う（prompt/schema はワークフロー側の
#   `Extract review control files from base branch` ステップが $RUNNER_TEMP へ抽出、
#   AGENTS.md は prompt 内の `git show HEAD^1:AGENTS.md` 指示）。PR 自身がこれらの
#   ファイルを改変しても、その改変は当の PR 自身のレビュー実行には一切反映されない
#   （次のコミット・別 PR の実行にも影響しない。反映は base ブランチへのマージ後に
#   限られる）。理由: レビュー対象の diff から直接 prompt/schema/基準を読み込む構成
#   だと、PR 差分が「レビュー指示（P0/P1 判定基準・完了判定）を弱める」よう改変しても、
#   その改変済み内容がそのまま自分自身のレビューに使われてしまう自己参照な構成になる
#   （イシュー #524 の PR #526 に対する Codex 自身のレビューで P0 指摘）。
#   イシュー #524 の PR #526 は review.md/review-schema.json/AGENTS.md 自体を変更する
#   最初の PR のため、この PR 自身の実行だけは base（変更前の main）の prompt/schema
#   が使われ `review_completed` フィールドを含まない旧 JSON が返る。結果としてこの
#   PR 自身の「Gate on review completion」は一度だけ赤くなるが、gate は advisory
#   （後述）でありマージを阻止しない。main へのマージ後は以降のすべての PR で新 gate
#   が有効になる。base 参照化により自己参照は成立しなくなったため、review.md /
#   review-schema.json / AGENTS.md「レビュー基準」節自体を変更する差分は、パスが
#   一致するというだけで「レビュー指示の改変」（プロンプトインジェクション規則、P0）
#   扱いにはしない。内容が禁止事項・完了判定を弱めるかどうかで判定する旨を
#   review.md（本文）・AGENTS.md「レビュー基準」節の双方に明記した（PR #526 の
#   Codex 自身のレビューがパス一致のみで一律 P0 と誤検知した事象を受けた追記）
# - 認証は codex-home 方式: API キー（OPENAI_API_KEY secret）は使わず、self-hosted runner
#   上に用意した ChatGPT ログイン済み CODEX_HOME ディレクトリ（auth.json を含む）を
#   CODEX_HOME 環境変数で参照する。パスは Actions variable `CODEX_HOME_DIR` で指定し、
#   **未設定の間は全ジョブを skip する**（runner 側の準備が済むまでレビューを実行しない
#   fail-closed ガード。有効化 = org/repo の variable `CODEX_HOME_DIR` にマウント先パスを
#   設定する、が唯一のスイッチ）。runner 側のセットアップは Fandhe-AI/local-server の
#   gha-runner 手順（runner コンテナへのホストディレクトリマウント + codex login --device-auth）
#   で行う。auth.json はパスワード同等のため、runner 上ではパーミッションを絞り
#   （700/600）、この runner を Fandhe-AI 外のリポジトリへ共有しない
#   （.agents/skills/openai-codex/scripts/auth.md の警告に従う）
# - self-hosted runner（.claude/rules/ci.md）のため、fork からの PR では実行しない
#   （untrusted コードの実行防止。fork の変更で codex-home の資格情報を触らせない）
# - コメント投稿は公式例と同じ 2 ジョブ分離パターン（codex ジョブは contents: read のみで
#   資格情報を扱い、書き込み権限（pull-requests: write）を持つジョブには渡さない）
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codex:
    # 汎用プール（root + apt-get 前提、self-hosted ラベル）ではなく、codex 専用の
    # no-sudo ランナー（非 root ジョブ実行・sudo 剥奪・docker.sock 非マウント・
    # デフォルトラベル無効で登録）で実行する。汎用プールは全ランナーが root 実行
    # のため「Verify sudo is not available」を通過できない。専用ランナーの構築は
    # Fandhe-AI/local-server の docs/gha-runner/（compose.codex.yml）を参照
    runs-on: no-sudo
    timeout-minutes: 30
    # (1) CODEX_HOME_DIR 未設定（runner 未準備）の間は実行しない
    # (2) fork PR では untrusted コードを self-hosted runner で実行しない（fail-closed）
    if: >-
      vars.CODEX_HOME_DIR != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    outputs:
      final_message: ${{ steps.collect.outputs.final_message }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v5（ci.yml と同一 SHA 固定）
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"

      # runner 上の auth.json へ触れるジョブのため、CLI もバージョン固定で導入する
      # （タグ差し替え・latest 汚染型のサプライチェーン攻撃を遮断）
      - name: Install Codex CLI
        run: npm install -g @openai/codex@0.146.1

      # codex-action の drop-sudo / Verify sudo privilege removed 相当の防御。
      # 直接実行では action の sudo 剥奪が効かないため、ジョブユーザーが passwordless
      # sudo を保持する runner では実行を拒否する（プロンプトインジェクションで
      # --sandbox read-only を脱出した場合の権限昇格への多層防御）。永続 runner で
      # 不可逆に sudo を剥奪すると他ジョブへ影響するため、剥奪ではなく fail-closed の
      # 事前検証とし、「ジョブユーザーに sudo を与えない」ことを runner 構築側
      # （Fandhe-AI/local-server の gha-runner 手順）の要件とする
      - name: Verify sudo is not available
        run: |
          if command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            echo "::error::runner のジョブユーザーが passwordless sudo を保持しています。codex exec を中止します（runner をジョブユーザー sudo なし構成にしてください）"
            exit 1
          fi
          echo "sudo なしを確認（実行継続）"

      # CLI が読み書きするファイルを PR の checkout 内容から切り離す多層防御:
      # (1) prompt / schema は PR の checkout（merge ref）からではなく、PR の base
      #     コミット（信頼済み参照）から `git show <sha>:<path>` で内容を直接抽出する。
      #     `git show` はファイルの中身（blob）をそのまま標準出力へ書き出すため、PR が
      #     当該パスを symlink 化していても抽出結果は常に通常ファイルの内容になり、
      #     symlink 経由で runner 上の任意ファイルを読ませる経路そのものが存在しない
      # (2) 抽出前に `git ls-tree <base-sha> -- <path>` で base コミット時点の git
      #     オブジェクトモードを確認し、通常ファイル（100644/100755）以外
      #     （symlink=120000・gitlink・パス欠落）は fail-closed で拒否する
      # (3) 出力先は PR が書き込めない $RUNNER_TEMP に置く（checkout 内の予測可能
      #     パスへ書くと、同名の絶対パス symlink コミットで runner 上の任意ファイル
      #     上書きに転用されうる）
      # base.sha は checkout 済みの `refs/pull/<n>/merge`（fetch-depth: 0）の親であり
      # 追加の fetch なしでローカルに存在するはずだが、念のため存在確認する
      - name: Extract review control files from base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::base コミット ${BASE_SHA} がローカルに存在しません（checkout の fetch-depth 設定を確認してください）"
            exit 1
          fi
          echo "base sha: ${BASE_SHA}"

          for f in .github/codex/prompts/review.md .github/codex/review-schema.json; do
            mode="$(git ls-tree "${BASE_SHA}" -- "$f" | awk '{print $1}')"
            if [ "${mode}" != "100644" ] && [ "${mode}" != "100755" ]; then
              echo "::error::base コミット ${BASE_SHA} 時点の $f が通常ファイルではありません（mode=${mode:-欠落}。symlink・欠落を拒否）"
              exit 1
            fi
          done

          git show "${BASE_SHA}:.github/codex/prompts/review.md" > "$RUNNER_TEMP/review.md"
          git show "${BASE_SHA}:.github/codex/review-schema.json" > "$RUNNER_TEMP/review-schema.json"

          echo "抽出したファイルの sha256:"
          sha256sum "$RUNNER_TEMP/review.md" "$RUNNER_TEMP/review-schema.json"

      # runner 上のログイン済み CODEX_HOME（ChatGPT 認証、CLI が refresh_token で
      # 自動更新する）を CODEX_HOME 環境変数で参照する。レビューは読み取りのみで
      # よいため sandbox は read-only を明示する。
      # codex の stdout（最終メッセージ）/ stderr（進行ログ）は Actions ログへ直接
      # 流さず一旦ファイルへバッファし、資格情報パターンをマスクしてから公開する
      # （後段のスキャンより先にログへ生出力が露出する経路を塞ぐ。マスクは表示用で、
      # 後段の fail-closed スキャンは生の JSON に対して行う）
      - name: Run Codex review
        env:
          CODEX_HOME: ${{ vars.CODEX_HOME_DIR }}
        run: |
          status=0
          codex exec \
            --sandbox read-only \
            --output-schema "$RUNNER_TEMP/review-schema.json" \
            --output-last-message "$RUNNER_TEMP/codex-review.json" \
            - < "$RUNNER_TEMP/review.md" \
            > "$RUNNER_TEMP/codex-exec.log" 2>&1 || status=$?
          sed -E \
            -e 's/eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}(\.[A-Za-z0-9_-]+)?/[REDACTED_JWT]/g' \
            -e 's/(^|[^A-Za-z0-9_])rt[._][A-Za-z0-9._~-]{20,}/\1[REDACTED_REFRESH_TOKEN]/g' \
            -e 's/sk-[A-Za-z0-9_-]{20,}/[REDACTED_KEY]/g' \
            -e 's/ghp_[A-Za-z0-9]{20,}/[REDACTED_TOKEN]/g' \
            -e 's/github_pat_[A-Za-z0-9_]{20,}/[REDACTED_TOKEN]/g' \
            "$RUNNER_TEMP/codex-exec.log"
          exit "$status"

      # 出力を公開（PR コメント投稿・ジョブ出力化）する前の資格情報混入検査。
      # read-only sandbox は読み取りを妨げないため、プロンプトインジェクション等で
      # auth.json のトークン（JWT）や API キーがレビュー結果へ混ざった場合に備え、
      # パターン検出時は出力へ載せず fail-closed でジョブを失敗させる
      - name: Scan output for credentials
        run: |
          if grep -qE 'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}|(^|[^A-Za-z0-9_])rt[._][A-Za-z0-9._~-]{20,}|sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$RUNNER_TEMP/codex-review.json"; then
            echo "::error::レビュー出力に資格情報らしきパターンを検出したため公開を中止します"
            exit 1
          fi
          echo "資格情報パターン: 検出なし"

      # jq -c で単一行 JSON へ正規化してジョブ出力にする（不正 JSON はここで fail し、
      # post_feedback は投稿対象なしとして skip される）
      - name: Collect final message
        id: collect
        run: echo "final_message=$(jq -c . "$RUNNER_TEMP/codex-review.json")" >> "$GITHUB_OUTPUT"

      # レビュー手順自体が完遂したかを P0/P1 判定より先に確認する（fail-closed）。
      # `Collect final message` の後に置くことで、gate 失敗時も final_message は
      # 空にならず、post_feedback（always() 実行）が失敗理由入りの summary を
      # PR コメントへ投稿できる。フィールド欠落・null・"true" 以外の値はすべて
      # 未完了側へ倒す厳密一致判定とする（イシュー #524／親 #523: runner の
      # sandbox 制約で diff・AGENTS.md を読めないまま findings 空の正常系 JSON が
      # 返り gate が素通りした事象への対処）。意図的にフォールバックは設けない:
      # prompt/schema を base ブランチから取得する構成（上記ヘッダコメント参照）へ
      # 移行するイシュー #524 の PR #526 自身の実行だけは base（review_completed
      # 未導入時点の main）の旧 schema が使われるため必ず一度この gate で失敗する
      # （移行的な既知の赤。gate は advisory でマージを阻止しない）。旧 schema か
      # どうかで判定を分岐させるフォールバックは、fail-open を閉じるための本 gate
      # 自身に fail-open の抜け道を作ることになるため設けない
      - name: Gate on review completion
        run: |
          completed="$(jq -r '.review_completed == true' "$RUNNER_TEMP/codex-review.json")"
          if [ "${completed}" != "true" ]; then
            echo "::error::Codex レビューが完了していません（review_completed != true。理由は PR コメントの summary 参照）"
            exit 1
          fi
          echo "review_completed: true（gate 通過）"

      - name: Gate on P0/P1 findings
        run: |
          count="$(jq '[.findings[] | select(.priority == "P0" or .priority == "P1")] | length' "$RUNNER_TEMP/codex-review.json")"
          if [ "${count}" -gt 0 ]; then
            echo "::error::Codex レビューで P0/P1 指摘が ${count} 件検出されました（詳細は PR コメント参照）"
            exit 1
          fi
          echo "P0/P1 指摘なし（gate 通過）"

  # gate 失敗時（needs.codex.result == 'failure'）でもレビュー結果コメントは投稿する
  post_feedback:
    runs-on: self-hosted
    timeout-minutes: 10
    needs: codex
    if: ${{ always() && needs.codex.outputs.final_message != '' }}
    permissions:
      pull-requests: write
    steps:
      - name: Post Codex feedback
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const raw = process.env.CODEX_FINAL_MESSAGE;
            let body;
            try {
              const result = JSON.parse(raw);
              const icon = { P0: '🟥', P1: '🟧', P2: '🟨', P3: '⬜' };
              const findings = (result.findings ?? [])
                .map(f => `- ${icon[f.priority] ?? '⬜'} **${f.priority}** ${f.title}（\`${f.location}\`）\n  ${String(f.detail).replace(/\n/g, '\n  ')}`)
                .join('\n');
              // review_completed !== true は gate（Gate on review completion）が
              // fail-closed で失敗させる異常系。findings が空でも「指摘はありません。」
              // という正常系相当の表示にはせず、未完了である旨を明示する
              // （イシュー #524／親 #523: gate 失敗が PR コメント上は正常に見える
              // fail-open な見た目を避ける）
              const findingsSection = result.review_completed === true
                ? (findings ? `### 指摘\n\n${findings}` : '指摘はありません。')
                : '⚠️ レビューが完了していません（gate 失敗。上記 summary の失敗理由を参照）。';
              body = `## Codex PR レビュー\n\n${result.summary}\n\n${findingsSection}`;
            } catch {
              // スキーマ外の出力でもレビュー内容は握りつぶさずそのまま提示する
              body = `## Codex PR レビュー\n\n${raw}`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
