name: docs-site

# docs サイト（crates/docs-site による SSG、Fandhe-AI/fandhe-frontend の
# 同名 workflow からの移植）を main push 時にビルドし GitHub Pages へ公開する。
# deploy 部分（upload-pages-artifact → deploy-pages）は Fandhe-AI/actions の
# 共通 reusable workflow `pages-deploy.yml` へ移設済み（イシュー #540。
# 実装本体・fail-closed 検証の詳細は同リポジトリの `pages-deploy/README.md`
# 参照。呼び出し側 wrapper 化の先行事例は `codex-review.yml`、#532）。
#
# 前提（手動操作）: リポジトリ Settings → Pages → Source を
# "GitHub Actions" に設定済みであること。未設定の場合 build ジョブは成功し
# deploy ジョブ（共通 workflow 側）のみが失敗する。CLI で有効化する場合の
# コマンド:
#   gh api -X POST repos/Fandhe-AI/fandhe-backend/pages -f build_type=workflow
#
# 既知の制約: レンダラ側クレート（crates.io の fandhe-frontend-core /
# fandhe-frontend-app / fandhe-frontend-server）の更新は Cargo.lock 経由で
# crates/docs-site/** のトリガーに乗らない場合がある。反映が必要な場合は
# workflow_dispatch で手動再デプロイする（手順・確認方法は
# docs/design/docs-site-redesign.md の「手動再デプロイ運用」節を参照）。

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "docs/api/**" # site/nav.toml の API Reference セクションのビルド入力（イシュー #398）
      - "site/**"
      - "crates/docs-site/**"
      - ".github/workflows/docs-site.yml" # 自己参照パターン（ci.yml 系と同様）
      # examples/** は site/nav.toml から参照されずビルド入力にならないため意図的に含めない
      # （site/examples/*.md へ再構成済み。追加すると空振りトリガーになる、イシュー #398）。

  workflow_dispatch:

permissions:
  contents: read # workflow レベルは read のみ（最小権限、.claude/rules/ci.md・A01/A05 対策）

concurrency:
  group: docs-site-pages
  # Pages デプロイ中断による中途半端な公開状態を避ける。reusable workflow
  # （deploy ジョブ）側のトップレベル concurrency は呼び出し元に対して機能しない
  # ため、本 workflow（呼び出し側）に必須の設定。
  cancel-in-progress: false

jobs:
  build:
    name: "build: docs site (SSG + linkcheck)"
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #554）。toolchain 導入は既に
    # dtolnay/rust-toolchain（ホステッド想定の実装）のため変更不要。
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 共有キャッシュ未命中時のコールドビルドを考慮（ci.md: timeout 必須）
    steps:
      - name: Checkout
        # actions/checkout v6.0.3（ci.yml と同一 SHA 固定）。
        # site/nav.toml が参照するのは site/ と docs/guide/ のみのため
        # docs/spec サブモジュールは不要（submodules 既定 false）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Rust toolchain
        # dtolnay/rust-toolchain（移植元 workflow と同一 SHA 固定）。
        # バージョン決定性のための明示セットアップ（旧 self-hosted 時代は cargo
        # 未導入インスタンスへの安全網。ホステッドでも維持する）。
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: "build: generate site into dist"
        # linkcheck は build_site() 内蔵（crates/docs-site/src/linkcheck.rs）。
        # リンク切れ検出時は書き出しを一切行わず非 0 終了する（fail-closed）。
        # 移植元 workflow の `--locked` は付けない: 本リポジトリは Cargo.lock を
        # コミットしない方針（.gitignore）のため、ci.yml の各ジョブと同様に
        # lock なしで解決する。
        run: cargo run -p fandhe-backend-docs-site -- --out "${RUNNER_TEMP}/docs-site-dist"

      # 出力先を RUNNER_TEMP 配下にする理由（旧 self-hosted 時代は作業ディレクトリの
      # ジョブ間永続による stale 生成物混入の回避。ホステッドの使い捨て VM でも
      # リポジトリ直下を汚さない配置原則として維持する）。
      - name: "verify: dist sanity check"
        # 空サイト・アセット欠落を黙って公開しないための決定的チェック（fail-closed）。
        # -s で非空も検証し、書き出しに失敗した 0 バイトファイルの見逃しを防ぐ。
        # assets/site.js はテーマトグル JS（crates/docs-site/src/script.rs、#390）。
        # assets/search-index.json は全文検索インデックス（crates/docs-site/src/search.rs・
        # build.rs、#396。build_site() が常に書き出す生成物のため無条件で検査対象に含める）。
        run: |
          test -s "${RUNNER_TEMP}/docs-site-dist/index.html"
          test -s "${RUNNER_TEMP}/docs-site-dist/assets/site.css"
          test -s "${RUNNER_TEMP}/docs-site-dist/assets/site.js"
          test -s "${RUNNER_TEMP}/docs-site-dist/assets/search-index.json"

      - name: Upload dist artifact
        # dist を汎用 artifact（名前は共通側既定の pages-dist）として渡す。
        # Pages 専用形式への変換（upload-pages-artifact）は pages-deploy 共通側が担う。
        # include-hidden-files: 既定 false では dotfile が upload 段階で脱落し
        # サイレント未配信になるため常時 true（deploy 側は共通 workflow が常時有効）。
        # 現行 SSG（crates/docs-site）の生成物に dotfile は存在しないため公開物は
        # 従来と同一のまま、将来 dotfile が増えた場合の脱落だけを防ぐ安全側の設定。
        # actions/upload-artifact v7.0.1（commit SHA 固定、tag の実コミット SHA を
        # GitHub API で解決済み）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-dist
          path: ${{ runner.temp }}/docs-site-dist
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # reusable workflow は呼び出し側が付与した以上の権限を持てないため、
    # 共通側ジョブが必要とする 2 権限をここでも付与する（A01/A05: deploy ジョブ
    # 限定の最小権限。runs-on / timeout-minutes / environment / steps は共通側が
    # ジョブレベルで定義するため本 wrapper には不要）
    permissions:
      pages: write # Pages デプロイ作成に必要
      id-token: write # OIDC によるデプロイ元検証に必要
    uses: Fandhe-AI/actions/.github/workflows/pages-deploy.yml@latest
    with:
      # upload-artifact は path 直下の内容を artifact ルートへ置くため、
      # dist ディレクトリ自体を path に指定した本 workflow では "." を指定する
      dist-dir: "."
      # pages-deploy の runner-label 既定値は self-hosted（docs/runner-policy.md §4）。
      # public リポジトリでは既定値への暗黙依存を避け、組織 runner 方針どおり
      # ubuntu-latest を明示する（イシュー #554。grep で self-hosted が見えない
      # 隠れた依存の解消）。
      runner-label: ubuntu-latest
