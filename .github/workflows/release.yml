# crates.io 公開ワークフロー（イシュー #373、docs/design/crates-io-release.md 6 節の実ファイル化）。
#
# 公開対象 13 クレート（publish = false でない全クレート）を verify → dry-run →
# publish の 3 段で crates.io へ公開する。v0.1.0（2026-07-21）は手動 publish だったが、
# 以後のバージョンは再現性・監査性のため本ワークフローに統一する。
#
# - トリガは `v*` タグ push と workflow_dispatch のみ。fork PR からシークレットへ
#   到達させないため `pull_request` はトリガに含めない（.claude/rules/ci.md）
# - publish ジョブは GitHub Environments `crates-io-release`（required reviewers）に
#   よる人間承認を必須とし、AI・CI による自動 publish は行わない
#   （feature-modification.md の自動マージ禁止と同一原則）
# - 認証は org シークレット CARGO_REGISTRY_TOKEN によるトークン認証（設計書の
#   フォールバック経路）。Trusted Publishing（OIDC）への移行は将来課題
#   （docs/design/crates-io-release.md 6 節）
# - cargo 1.96 の `cargo publish --workspace` は依存順（fandhe-backend-http →
#   fandhe-backend-routes → fandhe-backend-core → fandhe-backend-plugin-*）と
#   crates.io のインデックス反映待ちを自動解決するため、逐次 publish は不要
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

# publish の途中キャンセルは公開済み・未公開クレートが混在する中途半端な状態を
# 生むため、専有計測系（bench-schedule.yml）と同様にキャンセル不可とする
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: verify（fmt / clippy / test / dep-audit）
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        # docs/spec サブモジュールは取得しない（submodules 既定 false）。
        # fandhe-backend-spec は private リポジトリで GITHUB_TOKEN からアクセス
        # できず、verify（fmt / clippy / test / dep-audit）は spec 本文を参照
        # しないため、取得すると v0.2.0 リリース時のように checkout 段階で
        # 失敗する（ci.yml の各ジョブと同じ方針）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # 共通部品 rust-toolchain-setup が rustup の自己修復（未導入・破損時のみ
      # 非対話・HTTPS 検証込みインストール）と rust-toolchain.toml への同期を担う
      # （参照はコミット SHA 固定。.claude/rules/security.md）。
      - name: Setup Rust toolchain
        uses: Fandhe-AI/actions/rust-toolchain-setup@cafbcd7c1d339dcfb27017a4e941220810c33b0a # main

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --workspace --all-features

      # dep-audit.sh はツール不在時に導入せず異常終了する（fail-closed）ため、
      # ci.yml の dep-audit ジョブと同一のバージョン固定インストールを先行させる。
      # 共通部品 cargo-tool-install が冪等判定・導入後の厳密一致検証を担う
      # （サプライチェーン考慮: crates.io からバージョン固定（--locked）で取得し、
      # 参照はコミット SHA 固定。.claude/rules/security.md。Bugbot 指摘対応）
      - name: Ensure cargo-deny 0.19.8
        uses: Fandhe-AI/actions/cargo-tool-install@cafbcd7c1d339dcfb27017a4e941220810c33b0a # main
        with:
          tool: cargo-deny
          version: 0.19.8

      - name: Ensure cargo-audit 0.22.2
        uses: Fandhe-AI/actions/cargo-tool-install@cafbcd7c1d339dcfb27017a4e941220810c33b0a # main
        with:
          tool: cargo-audit
          version: 0.22.2

      - name: dep-audit（cargo audit / cargo deny、全 feature 構成）
        run: bash scripts/dep-audit.sh

  dry-run:
    name: cargo publish --workspace --dry-run
    needs: verify
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # 共通部品 rust-toolchain-setup が rustup の自己修復（未導入・破損時のみ
      # 非対話・HTTPS 検証込みインストール）と rust-toolchain.toml への同期を担う
      # （参照はコミット SHA 固定。.claude/rules/security.md）。
      - name: Setup Rust toolchain
        uses: Fandhe-AI/actions/rust-toolchain-setup@cafbcd7c1d339dcfb27017a4e941220810c33b0a # main

      # 公開対象 13 クレートを依存順自動解決でパッケージング検証する（トークン不要）
      - name: cargo publish --workspace --dry-run
        run: cargo publish --workspace --dry-run

  publish:
    name: cargo publish --workspace（要 環境承認）
    needs: dry-run
    runs-on: self-hosted
    # publish は 13 クレートのアップロード + crates.io インデックス反映待ちを含み、
    # ジョブタイムアウトによる途中打ち切りは「一部だけ公開済み」の部分公開状態を
    # 生む（concurrency の cancel-in-progress: false と同じ理由で避けたい失敗様態）。
    # dry-run より大幅に余裕を持たせる（Bugbot 指摘対応）
    timeout-minutes: 120
    # required reviewers による人間承認ゲート。承認されるまで publish は実行されない
    environment: crates-io-release
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # 共通部品 rust-toolchain-setup が rustup の自己修復（未導入・破損時のみ
      # 非対話・HTTPS 検証込みインストール）と rust-toolchain.toml への同期を担う
      # （参照はコミット SHA 固定。.claude/rules/security.md）。
      - name: Setup Rust toolchain
        uses: Fandhe-AI/actions/rust-toolchain-setup@cafbcd7c1d339dcfb27017a4e941220810c33b0a # main

      # トークンは env 経由でのみ渡し、コマンドライン引数・ログへ展開しない
      # （.claude/rules/security.md）。CARGO_REGISTRY_TOKEN は cargo が標準で
      # 参照する環境変数のため --token 引数は不要
      - name: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace
