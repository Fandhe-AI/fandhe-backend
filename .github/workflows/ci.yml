name: CI

# TASK-1.1（docs/spec/05-tasks.md）: cargo workspace 全体の品質ゲート。
# 以降の全実装タスク（TASK-1.2〜）はこの CI を前提に進める。
# TASK-15.2（#17）: 依存監査（dep-audit ジョブ）を追加し、schedule（日次）で
# コード変更のない期間に新規公開される RustSec advisory も検知できるようにした
# （OWASP A06、.claude/rules/security.md）。schedule 実行時は fmt/clippy/test を
# 省略し dep-audit のみ走らせる（旧 self-hosted 時代は runner 負荷抑制が動機。
# ホステッド移行後も無駄なジョブ実行を避ける原則として維持、.claude/rules/ci.md）。
# TASK-11.4（#36）: PoC-9 で確認された「オフバイワンのバグがテスト失敗ではなく
# `cargo test` のハングとして現れる」事例（docs/spec/04-requirements.md NFR-10）を受け、
# 全ジョブに `timeout-minutes` を設定（多層防御。旧 self-hosted 時代は runner の
# 無期限占有防止が動機で、ホステッドでも分数浪費・キュー占有防止として維持）し、
# test ジョブは cargo-nextest（.config/nextest.toml でテスト単位のタイムアウトを規定）に
# 切り替えた。
# TASK-12.1-1（#79）: `unsafe` の増加検知（scripts/unsafe-triage.sh）を独立ジョブとして
# 追加し、dep-audit ジョブに限り schedule/workflow_dispatch 実行時の Issue 起票ステップ
# （AI が能動的に改善案を提示する機構の一部）を追加した。
# TASK-14.1（#39）: REQ-14（docs/spec/04-requirements.md）が定める完遂判定基準
# 「CI（cargo test/clippy -D warnings/fmt --check）が全て通過」を、個別ジョブの状態を
# 都度確認する運用ではなく単一ジョブ `ci-complete` の成否として機械判定できるようにした。
# branch protection / ruleset（scripts/setup-required-checks.sh）は `ci-complete` のみを
# required status check に指定すればよく、判定対象ジョブを増減する際は `ci-complete` の
# `needs` を変更するだけで済む（ジョブ改名時に required check が暗黙に外れる設定腐敗を防ぐ）。
# 「追加機能が受け入れ基準を満たすこと」は機械判定できないため対象外とし、
# レビューゲート（TASK-14.3、#41）で担保する（docs/design/ci-completion-criteria.md 参照）。
# TASK-14.3（#41）: レビューゲート運用の受け入れテスト（scripts/tests/run-review-gate-tests.sh
# --offline）を unsafe-triage ジョブに追加し、TASK-14.2 の deny lint 表・本ジョブ構成の
# 退行を CI 常設で検知する（docs/design/review-gate.md 参照）。
# TASK-12.3-2（#84）: 対応可否自律判断ガードレール（TASK-12.3-1、#83、
# docs/design/feasibility-guardrail.md）の判定記録バリデータ（scripts/feasibility-check.sh）
# のセルフテスト（scripts/tests/run-guardrail-tests.sh）を unsafe-triage ジョブに追加した。
# 既存セルフテスト群と同列・軽量（ネットワーク・cargo ビルド不要）で、判定記録の形式・
# 必須項目・fail-closed 原則の退行を CI 常設で検知する。
# TASK-3.2（#31）: 「gen-openapi CLI 実行 → openapi.json 生成 → サーバー本体ビルド」の
# 2 段階ビルド順序を openapi-two-stage ジョブとして明示ステップ化した
# （scripts/openapi-two-stage.sh を呼ぶだけの薄いジョブ）。ビルドを伴うため
# schedule（日次 dep-audit のみを走らせる方針）からは除外する。
# TASK-6.1（#54）: openapi-two-stage の後段として「openapi.json → openapi-typescript →
# TS 型 → tsc --noEmit 型検査」の openapi-typescript 連携パイプラインを openapi-ts
# ジョブとして追加した（scripts/openapi-ts.sh を呼ぶだけの薄いジョブ、
# docs/design/openapi-typescript-pipeline.md 参照）。node/npm ビルドを伴うため
# schedule からは除外する。
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # update-external.yml（00:00 UTC）と 30 分ずらして負荷を分散する
    - cron: "30 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # cargo fmt --check（整形差分の検出）
  # --------------------------------------------------
  fmt:
    name: cargo fmt --check
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #551）。
    runs-on: ubuntu-latest
    # schedule（日次）実行時は依存監査（dep-audit）のみを走らせる
    if: github.event_name != 'schedule'
    # TASK-11.4（#36）: ハングしたジョブの無期限実行を防ぐ上限（多層防御の一段目。
    # ホステッドランナーでも分数浪費・キュー占有を防ぐ意味で維持する）。
    # fmt --check は通常数秒〜数十秒で完了する。
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout v6.0.3。update-external.yml と同一 SHA で固定する。
        # submodule（docs/spec）は fmt/clippy/test に不要なため取得しない。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#551）: self-hosted 永続環境前提の
      # Fandhe-AI/actions/rust-toolchain-setup（rustup 自己修復）に代えて
      # dtolnay/rust-toolchain（SHA 固定、docs-site.yml build ジョブの先行事例と同一 SHA）を
      # 使う。バージョン解決は rust-toolchain.toml（channel = "stable"）と一致させ、
      # 必要 component は action 側 input で明示する（minimal profile 導入時にも
      # rustfmt が確実に揃うようにする保険）。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all --check

  # --------------------------------------------------
  # cargo clippy -- -D warnings（lint ゲート）
  # --------------------------------------------------
  clippy:
    name: cargo clippy
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #551）。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # TASK-11.4（#36）: 多層防御の一段目。clippy はビルドを伴うため fmt より長めに確保する。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#551）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （fmt ジョブと同一方針・同一 SHA）。`id: toolchain` は後続 actions/cache の
      # キー（outputs.cachekey = toolchain のリリースを表す文字列）に使う。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy

      # ホステッドランナーは使い捨て VM のためビルドキャッシュが残らない。
      # actions/cache（GitHub 公式、SHA 固定 v6.1.0）で cargo registry と target を
      # ジョブ系統（job family）別キーで保存・復元する（キー設計は fandhe-frontend
      # docs/ci/hosted-runner-migration.md §3.3 の先例を踏襲。本リポジトリは
      # Cargo.lock をコミットしない方針のため hashFiles は Cargo.toml を入力にする）。
      # キャッシュはビルド時間短縮の最適化であり、miss はフルビルドへ自然に
      # フォールバックする（registry 系は fail-open。target/ の復元は理論上
      # fingerprint fresh 判定へ影響しうるが、fork PR のキャッシュスコープ分離
      # （default branch scope へ書き込めない GitHub の仕様）により汚染リスクは
      # 低いと判断して採用する）。job family prefix（clippy-/doc- 等）でキーを
      # 分離し、将来 release 系ワークフローがキャッシュを導入する場合も
      # 検証ビルド生成物と prefix を混在させない設計とする。
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: clippy-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            clippy-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # --all-features を指定しておくことで、TASK-2.1 以降で feature（plugin-*）が
      # 増えた際にも既定で全 feature を lint 対象にできる。feature 構成別の
      # マトリクス化（無効化時の pay-for-what-you-use 検証）は TASK-2.2（#19）で
      # `pay-for-what-you-use` ジョブとして整備済み。本ステップは全 feature 構成、
      # 次ステップは無効構成に限定した lint を担う。
      - name: cargo clippy --workspace --all-targets --all-features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # TASK-2.2（#19）: pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）の
      # 検証表が求める「無効構成での lint」を CI 化する（docs/design/plugin-boundary.md
      # 6 節の手動コマンド表を機械検証へ格上げ）。
      - name: cargo clippy -p fandhe-backend-core --all-targets --no-default-features
        run: cargo clippy -p fandhe-backend-core --all-targets --no-default-features -- -D warnings

  # --------------------------------------------------
  # cargo nextest run（テスト単位のタイムアウト付き） + cargo test --doc
  # TASK-11.4（#36）: stable ツールチェーンでは `cargo test` 単体にテスト単位の
  # タイムアウトを持たせられないため、cargo-nextest をテストランナーに採用する。
  # ハング型退行は .config/nextest.toml（profile: ci）の slow-timeout により
  # 個別テストの TIMEOUT 失敗として検知される（PoC-9 事例対応）。
  # nextest は doc test を実行しないため、doc test 必須方針
  # （.claude/rules/coding-rust.md）を守るべく `cargo test --doc` を別ステップで維持する。
  # --------------------------------------------------
  test:
    name: cargo test
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #552。置換方針は #551 で確立）。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # TASK-11.4（#36）: テスト単位のタイムアウト（nextest 側、最大 120 秒/テスト）に
    # 加えたジョブ全体の上限。多層防御。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#552）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （#551 の fmt/clippy ジョブと同一方針・同一 SHA）。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # ビルドキャッシュ（#551 の clippy ジョブと同一設計、job family prefix は test-）。
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            test-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # バージョン固定インストール（dep-audit ジョブと同じ方針）。共通部品
      # cargo-tool-install が「導入済み同一バージョンならスキップ」の冪等判定と
      # 導入後の厳密一致検証を担う（サプライチェーン考慮: crates.io からバージョン固定
      # （--locked）で取得し、参照はコミット SHA 固定。.claude/rules/security.md）。
      # ホステッドの使い捨て VM では冪等スキップは常に不成立で毎ジョブ新規インストール
      # になる（.claude/rules/ci.md「ホステッド前提への読み替え」。導入検証は弱体化しない）。
      - name: Ensure cargo-nextest 0.9.137
        uses: Fandhe-AI/actions/cargo-tool-install@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          tool: cargo-nextest
          version: 0.9.137

      - name: cargo nextest run --workspace --all-features --profile ci
        # テスト単位のタイムアウトは .config/nextest.toml（profile: ci）で規定。
        # ハングしたテストは TIMEOUT として失敗扱いになりジョブ全体を止めずに検知できる。
        run: cargo nextest run --workspace --all-features --profile ci

      - name: cargo test --doc --workspace --all-features
        # nextest は doc test を実行しないため別ステップで補う。
        # テスト単位のタイムアウトは適用できないためステップ単位でガードする。
        timeout-minutes: 15
        run: cargo test --doc --workspace --all-features

  # --------------------------------------------------
  # cargo doc（rustdoc lint・missing_docs の機械強制ゲート）
  # TASK-11.2-2（docs/spec/05-tasks.md、#76）: workspace ルート `[workspace.lints.rust]`
  # の `missing_docs = "warn"` は clippy の `-D warnings` で実質 deny に昇格するが、
  # rustdoc 固有 lint（intra-doc リンク切れ等）は clippy では検査されない。
  # `RUSTDOCFLAGS=-D warnings` での `cargo doc` を独立ジョブとして追加し、
  # doc コメント網羅率・整合性の両方を CI で機械強制する。
  # --------------------------------------------------
  doc:
    name: cargo doc
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #551）。
    runs-on: ubuntu-latest
    # TASK-11.5-2（#78）: TASK-11.4（#36）で他ジョブに設定した多層防御の
    # `timeout-minutes` が本ジョブに漏れていたため追補する（受け入れチェック
    # `scripts/accept-task-11-5.sh` のチェック 4「CI テストタイムアウト設定」で検知）。
    # cargo doc はビルドを伴うため clippy と同程度の上限を設定する。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#551）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （fmt ジョブと同一方針・同一 SHA）。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # ビルドキャッシュ（clippy ジョブと同一設計、job family prefix のみ doc- に変更）。
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: doc-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            doc-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

  # --------------------------------------------------
  # 依存監査（cargo audit / cargo deny check）を全 feature 構成で実行（TASK-15.2、#17）。
  # deny.toml 冒頭コメントで宣言している CI 組み込み先。
  # TASK-12.1-1（#79）: cargo audit 呼び出しは scripts/audit-triage.sh 経由になり
  # トリアージレポートを生成する（scripts/dep-audit.sh 参照）。schedule /
  # workflow_dispatch 実行時に限り、vulnerability 検知を Issue として能動的に提示する
  # ステップを追加するため、本ジョブにのみ job 単位で `issues: write` を付与する
  # （workflow 全体は `contents: read` を維持、最小権限）。
  # --------------------------------------------------
  dep-audit:
    name: cargo audit / cargo deny (all feature configs)
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #552。置換方針は #551 で確立）。
    # `issues: write` の自動起票ロジック（schedule / workflow_dispatch 限定）は
    # ランナー非依存のため不変。
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # TASK-11.4（#36）: 本ジョブ自体は「CI テスト」のタイムアウト対応（本イシューの主目的）
    # のスコープ外だが、多層防御を一貫させるため他ジョブと同様に上限を設定する。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#552）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （#551 の fmt/clippy ジョブと同一方針・同一 SHA）。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # キャッシュ（#551 と同一設計、job family prefix は dep-audit-）。本ジョブは
      # ワークスペースの通常ビルドを持たない（dep-audit.sh は cargo metadata /
      # deny check / audit のみで ./target へ成果物を出さない）ため、`target` は
      # キャッシュ対象に含めず registry 系のみとする（リポジトリ 10GB 上限の圧迫回避）。
      # cargo-deny / cargo-audit の `cargo install`（ソースビルド）が registry
      # キャッシュの恩恵を受ける。
      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: dep-audit-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            dep-audit-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # ツールのバージョン固定インストール。共通部品 cargo-tool-install が
      # 「導入済み同一バージョンならスキップ」の冪等判定と導入後の厳密一致検証を担う
      # （サプライチェーン考慮: crates.io からバージョン固定（--locked）で取得し、
      # 参照はコミット SHA 固定。.claude/rules/security.md）。ホステッドの使い捨て VM
      # では毎ジョブ新規インストールになる（導入検証は弱体化しない）。
      - name: Ensure cargo-deny 0.19.8
        uses: Fandhe-AI/actions/cargo-tool-install@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          tool: cargo-deny
          version: 0.19.8

      - name: Ensure cargo-audit 0.22.2
        uses: Fandhe-AI/actions/cargo-tool-install@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          tool: cargo-audit
          version: 0.22.2

      - name: dep-audit.sh（全 feature 構成の cargo audit / cargo deny check）
        id: dep_audit
        # audit-triage.sh 経由の cargo audit が vulnerability を検知すると非 0 で
        # 終了する（フェイルクローズ）。ジョブは失敗させたまま、次のステップで
        # トリアージレポートを再生成して Issue 起票に使う（`if: always()` で
        # 本ステップの成否に関わらず後続ステップを実行する）。
        run: bash scripts/dep-audit.sh

      - name: audit-triage.sh の Issue 起票（schedule / workflow_dispatch 限定）
        # 本ステップは「フレームワーク自身の自動監査機構」による能動的な提示であり、
        # 開発エージェントが Issue 起票前にユーザー承認を得る規約
        # （.claude/rules/out-of-scope-tracking.md）とは別レイヤの自動化として扱う。
        #
        # PR/push 実行時は開発者が CI ログで直接確認できるためスキップし、
        # コード変更のない期間に新規公開される advisory を拾う schedule と、
        # 手動確認用の workflow_dispatch のみ対象にする。
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # audit-triage.sh の失敗（vulnerability 検知）自体は前ステップで既に
          # ジョブを失敗させている。ここでは Issue 起票のために再度レポートを
          # 生成するだけで、監査結果（ジョブ失敗）そのものは変えない。
          #
          # --vuln-ids-output は vulnerabilities.list[]（自動更新提案・要エスカレー
          # ション区分）の advisory ID のみを書き出す。markdown レポート全体を正規
          # 表現で走査すると「情報（記録・監視）」区分（unmaintained 等の warnings）
          # の advisory ID まで拾ってしまい、CI が green（warnings のみで exit 0）
          # にもかかわらず Issue が起票される不整合が生じるため、この専用出力で
          # vulnerability のみに厳密に絞り込む。
          REPORT_FILE="$(mktemp)"
          VULN_IDS_FILE="$(mktemp)"
          bash scripts/audit-triage.sh --output "${REPORT_FILE}" --vuln-ids-output "${VULN_IDS_FILE}" > /dev/null 2>&1 || true

          if [ ! -s "${REPORT_FILE}" ] || [ ! -s "${VULN_IDS_FILE}" ]; then
            echo "vulnerability が検知されなかったため Issue 起票をスキップします"
            exit 0
          fi

          # ラベルは冪等に作成する（既存でも失敗させない）。
          gh label create audit-triage --color B60205 \
            --description "cargo audit 指摘の自動トリアージ Issue（TASK-12.1-1, #79）" \
            --force || echo "警告: audit-triage ラベルの作成に失敗しました（gh 障害でも監査結果は変えない）" >&2

          # advisory ID ごとに重複起票を防ぐ（gh issue list の検索クエリはデータとして
          # 渡し、シェル再解釈やコマンド置換に埋め込まない。OWASP A03 対策）。
          mapfile -t advisory_ids < "${VULN_IDS_FILE}"

          for advisory_id in "${advisory_ids[@]}"; do
            existing="$(gh issue list --search "${advisory_id}" --state open --label audit-triage --json number --jq 'length' || echo "0")"
            if [ "${existing}" != "0" ]; then
              echo "既存 Issue あり（スキップ）: ${advisory_id}"
              continue
            fi

            gh issue create \
              --title "audit-triage: ${advisory_id} の対応要否を確認" \
              --label audit-triage \
              --body-file "${REPORT_FILE}" \
              || echo "警告: ${advisory_id} の Issue 起票に失敗しました（gh 障害でも監査結果は変えない）" >&2
          done

  # --------------------------------------------------
  # unsafe 追加のラチェット検知（TASK-12.1-1、#79）。ビルド不要で軽量なため
  # schedule（日次、dep-audit のみを走らせる方針）からは除外する。
  # --------------------------------------------------
  unsafe-triage:
    name: unsafe 追加の検知トリアージ
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #551）。grep/bash 中心 +
    # cargo metadata のみでビルドを伴わないため actions/cache は付けない。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          # TASK-13.2（#50）: extension-closure-check.sh --commit / gate の merge-base
          # 解決・req13-change-impact-accept.sh 基準 D（実コミット 3ae6d11 等の再現）が
          # フル履歴を要するため、本ジョブに限り shallow clone（既定 depth=1）を解除する。
          # TASK-13.1（#49）時点で「shallow clone で誤 FAIL するため CI に組み込まない」と
          # されていた制約はこれで解消する（docs/design/extension-closure-verification.md
          # 7 節参照）。他ジョブ（fmt/clippy/test 等）は履歴を要さないため既定のまま。
          fetch-depth: 0

      # dep-direction-check.sh（下記）が `cargo metadata` を要するため toolchain を
      # 同期する。既存ステップ（grep ベース）は cargo 非依存のため影響しない。
      # ホステッド移行（#551）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （fmt ジョブと同一方針・同一 SHA）。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: unsafe-triage.sh（baseline 比較・SAFETY コメント検査）
        run: bash scripts/unsafe-triage.sh

      - name: run-triage-tests.sh（audit/unsafe トリアージロジックのセルフテスト）
        run: bash scripts/tests/run-triage-tests.sh

      # TASK-12.2-1（#81）: feature-flow-check.sh（機能要求→実装→テスト一貫改修フローの
      # 実装/テスト同時性チェック）のセルフテストのみを CI 化する。feature-flow-check.sh
      # 本体を PR の必須ゲートとして組み込む対応（完遂判定への接続）は #82 のスコープ。
      - name: run-feature-flow-tests.sh（feature-flow-check.sh のセルフテスト）
        run: bash scripts/tests/run-feature-flow-tests.sh

      - name: run-review-gate-tests.sh --offline（レビューゲート運用のオフライン退行検知、TASK-14.3、#41）
        run: bash scripts/tests/run-review-gate-tests.sh --offline

      - name: run-guardrail-tests.sh（対応可否判定記録バリデータのセルフテスト、TASK-12.3-2、#84）
        run: bash scripts/tests/run-guardrail-tests.sh

      # イシュー #221: .claude/worktrees/ 残存ワークツリー整理スクリプトのセルフテスト。
      # 本体（clean-worktrees.sh）は 97GB 規模の削除を伴いうるため CI には組み込まず、
      # 一時 git リポジトリで検証するセルフテストのみを常設する。
      - name: run-clean-worktrees-tests.sh（clean-worktrees.sh のセルフテスト、#221）
        run: bash scripts/tests/run-clean-worktrees-tests.sh

      # イシュー #238: NFR-8 注入リグレッション検知ハーネスのセルフテスト。本体
      # （regression-injection-verify.sh）は 12 ケース分の cargo フルビルドを伴い重い
      # ため CI には組み込まず（無駄な重量ジョブを常設しない方針、.claude/rules/ci.md）、
      # スタブゲート注入でロジックのみを検証するセルフテストを常設する。
      - name: run-regression-injection-tests.sh（regression-injection-verify.sh のセルフテスト、#238）
        run: bash scripts/tests/run-regression-injection-tests.sh

      # TASK-1.5（#14）: server → routes → http::* の依存方向一方向性を機械検証する。
      - name: dep-direction-check.sh（依存方向一方向性の機械検証）
        run: bash scripts/dep-direction-check.sh

      - name: run-dep-direction-tests.sh（dep-direction-check.sh のセルフテスト）
        run: bash scripts/tests/run-dep-direction-tests.sh

      # TASK-2.2（#19）: pay-for-what-you-use-check.sh（別途 pay-for-what-you-use ジョブで
      # 実行、cargo ビルドを伴い重い）のセルフテストのみを、他の軽量セルフテストと同列で
      # ここに相乗りさせる（ネットワーク・cargo ビルド不要）。
      - name: run-pay-for-what-you-use-tests.sh（pay-for-what-you-use-check.sh のセルフテスト）
        run: bash scripts/tests/run-pay-for-what-you-use-tests.sh

      # TASK-15.4（#52）: 依存監査基盤（TASK-15.1〜15.3）の受け入れ検証スクリプト
      # scripts/accept/dep-audit-accept.sh 自体は基準 2・3 の実体（cargo audit/deny・
      # fuzz）を既設の dep-audit / fuzz-smoke ジョブが PR ごと・日次で二重実行を避けつつ
      # 継続検証するため CI 直接実行しない。判定ロジックのみを検証するセルフテストを
      # 他の軽量セルフテストと同列でここに相乗りさせる（ネットワーク・cargo ビルド不要）。
      - name: run-dep-audit-accept-tests.sh（dep-audit-accept.sh のセルフテスト）
        run: bash scripts/tests/run-dep-audit-accept-tests.sh

      # TASK-13.1（#49）: extension-closure-check.sh（拡張点への変更影響範囲閉包の機械判定）
      # のセルフテスト。
      - name: run-extension-closure-tests.sh（extension-closure-check.sh のセルフテスト）
        run: bash scripts/tests/run-extension-closure-tests.sh

      # TASK-13.2（#50）: extension-closure-gate.sh（新規プラグイン追加 PR への拡張点閉包
      # ゲートの自動実行、docs/design/dependency-graph-contract.md 4 節）のセルフテスト。
      - name: run-extension-closure-gate-tests.sh（extension-closure-gate.sh のセルフテスト）
        run: bash scripts/tests/run-extension-closure-gate-tests.sh

      # TASK-13.2（#50）: PR 差分に対する拡張点閉包ゲートの実行。crates/plugin-* /
      # crates/core/src/plugin.rs を含まない PR は SKIP（exit 0）、含む PR は
      # 閉包判定 + E ファイルの理由明記照合を行う（docs/design/dependency-graph-contract.md
      # 4 節）。push/schedule/workflow_dispatch では base_ref が定義されないため
      # pull_request イベントのみで実行する。
      - name: extension-closure-gate.sh（拡張点閉包 PR ゲート）
        if: github.event_name == 'pull_request'
        run: bash scripts/extension-closure-gate.sh --base "origin/${{ github.base_ref }}"

      # TASK-13.2（#50）: REQ-13 受け入れテスト一式（基準 A〜F、
      # docs/design/dependency-graph-contract.md・docs/acceptance/req13-change-impact.md）。
      # 上の Checkout で fetch-depth: 0 にしたことで基準 D（実コミット 3 件の閉包判定再現）が
      # shallow clone 制約なしに実行できる。
      - name: req13-change-impact-accept.sh（REQ-13 受け入れテスト、TASK-13.2/#50）
        run: bash scripts/accept/req13-change-impact-accept.sh

      # TASK-6.1（#54）: openapi-ts.sh（openapi-typescript 連携パイプライン、
      # ネットワーク・cargo ビルド・npm 実行を伴うため別途 openapi-ts ジョブで実行）の
      # 判定ロジック（引数検証・diff 鮮度判定・ツール不在時 fail-closed）のセルフテスト。
      - name: run-openapi-ts-tests.sh（openapi-ts.sh のセルフテスト）
        run: bash scripts/tests/run-openapi-ts-tests.sh

      # TASK-6.2（#55）: openapi-ts-negative.sh（陰性対照、別途 openapi-ts ジョブで実行）の
      # 判定ロジック（引数検証・fail-closed・discrimination・CI ステップ存在確認）のセルフテスト。
      - name: run-openapi-ts-negative-tests.sh（openapi-ts-negative.sh のセルフテスト）
        run: bash scripts/tests/run-openapi-ts-negative-tests.sh

  # --------------------------------------------------
  # pay-for-what-you-use 検証（TASK-2.2、#19）: プラグイン feature 無効時に当該
  # プラグインの依存クレート・unsafe・コードが 0 件であることを機械的に PASS/FAIL
  # 判定する（.claude/rules/pay-for-what-you-use.md、docs/design/plugin-boundary.md
  # 6 節の手動コマンド表を機械検証へ格上げ）。release ビルド ×2（無効構成／
  # --all-features）と cargo-geiger 実行を伴い重いため独立ジョブとする。
  # schedule（日次、dep-audit のみを走らせる方針）からは除外する。
  # --------------------------------------------------
  pay-for-what-you-use:
    name: pay-for-what-you-use 検証（cargo tree/geiger・バイナリサイズ）
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #552。置換方針は #551 で確立）。
    # release ビルド ×2 + cargo-geiger のソースインストールを伴うため、キャッシュ
    # miss（コールド）時の実測で timeout-minutes の妥当性を確認する（実測は本移行
    # PR 自身の CI 実行が兼ねる。30 分に収まらない場合は移行 PR 内で延長して再実測
    # する。イシュー #552 受け入れ条件 4）。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#552）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （#551 の fmt/clippy ジョブと同一方針・同一 SHA）。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # キャッシュ（#551 と同一設計、job family prefix は pay-for-what-you-use-）。
      # pay-for-what-you-use-check.sh の各構成ビルドは `target/` 配下のサブディレクトリ
      # （target/pay-for-what-you-use-check{,-all,-geiger} 等）を使うため、`target` の
      # キャッシュがそのまま全構成に効く。
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: pay-for-what-you-use-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            pay-for-what-you-use-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # バージョン固定インストール（dep-audit / test ジョブと同じ方針。共通部品
      # cargo-tool-install が冪等判定・導入後の厳密一致検証を担う（サプライチェーン考慮:
      # crates.io からバージョン固定（--locked）で取得し、参照はコミット SHA 固定）。
      # ホステッドの使い捨て VM では毎ジョブ新規インストールになる。
      # cargo-geiger はビルドを伴い壊れやすい実績のあるツールのため、本ジョブでは
      # dep-impact.sh と異なり必須ツールとして扱う（未導入・実行失敗は FAIL）。
      - name: Ensure cargo-geiger 0.13.0
        uses: Fandhe-AI/actions/cargo-tool-install@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          tool: cargo-geiger
          version: 0.13.0

      - name: pay-for-what-you-use-check.sh（cargo tree/geiger・バイナリサイズ・全構成ビルド）
        run: bash scripts/pay-for-what-you-use-check.sh

  # --------------------------------------------------
  # openapi 2 段階ビルド（TASK-3.2、#31）: 「gen-openapi CLI 実行 → openapi.json 生成 →
  # サーバー本体ビルド」の順序を明示ステップとして CI に組み込む。stage 1（--check）で
  # コミット済み crates/plugin-openapi/openapi.json が ApiDoc の最新定義と乖離していないか
  # を検知し（fail-closed、OWASP A08 対策）、stage 2 で --all-features ワークスペース
  # ビルドを実行する。詳細は scripts/openapi-two-stage.sh を参照。
  # --------------------------------------------------
  openapi-two-stage:
    name: openapi 2 段階ビルド（gen-openapi --check → cargo build）
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #553。置換方針は #551 で確立）。
    # openapi-spec-validator の pip 導入（--user --break-system-packages・
    # `python3 -m` 実行形式）はランナー非依存のため不変（ubuntu-latest の PEP 668
    # 環境でも --break-system-packages で動作する）。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#553）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （#551 の fmt/clippy ジョブと同一方針・同一 SHA）。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # ビルドキャッシュ（#551 と同一設計、job family prefix は openapi-two-stage-）。
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: openapi-two-stage-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            openapi-two-stage-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: "openapi-two-stage.sh（stage 1: gen-openapi --check、stage 2: cargo build --all-features）"
        run: bash scripts/openapi-two-stage.sh

      # TASK-3.3（#32）REQ-3 受け入れ基準 1: 生成された openapi.json が OpenAPI 3.x の
      # 構文妥当性エラー 0 件であることを CI 常設で検証する（API 設計ベストプラクティス系
      # ルール、例: Spectral/Redocly が検出する命名規約・説明文有無等とは区別する）。
      # openapi-spec-validator はスキーマ妥当性のみを検証しベストプラクティス系ルールを
      # 含まないため要求に合致する（選定理由は docs/acceptance/req3-openapi-generation.md
      # を参照）。サプライチェーン考慮でバージョン pin する（.claude/rules/security.md）。
      # `python3 -m openapi_spec_validator --version` は当該 CLI が `--version`
      # フラグ自体を持たずエラー終了するため疎通確認に使えない（Bugbot 指摘、PR
      # #141: 常に pip install が走ってしまう）。モジュールの `__version__` 属性で
      # 導入済みバージョンを直接判定する。インストールも `pip` コマンドではなく
      # `python3 -m pip` で実行する（Bugbot 指摘、PR #141 review 3603198341: 素の
      # `pip` は環境によって `python3` と異なるインタプリタを指すことがあり
      # （旧 self-hosted runner で実際に発生）、インストールしたパッケージが後続の
      # `python3 -m openapi_spec_validator` から見えず CI が不安定または恒常的に
      # 失敗しうる。インタプリタ一致の頑健化として runner 種別に依らず維持する）。
      # このステップは openapi-two-stage ジョブ内で実行する（Bugbot 指摘、PR #150 review
      # 4724126384: openapi-ts ジョブを新設した際にバリデータステップを誤って openapi-ts
      # 側にのみ残していたため、TS パイプラインが先に失敗すると openapi-two-stage が成功
      # していてもスキーマ検証が実行されない問題があった。REQ-3 の受け入れ条件・
      # docs/acceptance/req3-openapi-generation.md が openapi-two-stage ジョブでの実行を
      # 期待しているため本ジョブに戻す）。
      - name: Ensure openapi-spec-validator 0.7.1
        run: |
          if ! python3 -c "import openapi_spec_validator; print(openapi_spec_validator.__version__)" 2>/dev/null | grep -qx '0\.7\.1'; then
            python3 -m pip install --user --break-system-packages "openapi-spec-validator==0.7.1"
          fi

      # pip --user 配置スクリプトは実行環境の PATH に含まれるとは限らない
      # （旧 self-hosted runner で /root/.local/bin が未設定のケースが実在した。
      # PATH 非依存の頑健化として runner 種別に依らず維持する）ため、
      # PATH 依存のコマンド解決を避けて `python3 -m` によるモジュール実行形式で
      # 呼び出す（PR #141 CI failure 対応）。
      - name: openapi.json 構文妥当性検証（openapi-spec-validator）
        run: python3 -m openapi_spec_validator crates/plugin-openapi/openapi.json

  # --------------------------------------------------
  # openapi-typescript 連携パイプライン（TASK-6.1、#54、REQ-6）: 「gen-openapi --check →
  # npm ci --ignore-scripts → openapi-typescript による schema.d.ts 鮮度検証 →
  # tsc --noEmit」の一方向パイプラインを検証する。詳細は scripts/openapi-ts.sh・
  # docs/design/openapi-typescript-pipeline.md を参照。node/npm ビルドを伴うため
  # schedule（日次、dep-audit のみを走らせる方針）からは除外する。openapi.json の構文
  # 妥当性検証（openapi-spec-validator）は openapi-two-stage ジョブ側で実行する
  # （REQ-3 受け入れ条件・Bugbot 指摘 PR #150 review 4724126384）。
  # --------------------------------------------------
  openapi-ts:
    name: openapi-typescript 連携パイプライン（schema.d.ts 鮮度検証 → tsc --noEmit）
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #553。置換方針は #551 で確立）。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#553）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （#551 の fmt/clippy ジョブと同一方針・同一 SHA）。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # openapi-ts.sh は node >= 24（ts/package.json の engines / volta フィールド）を
      # 前提とする。self-hosted では volta 常設だったが、ホステッドのプリインストール
      # node はメジャーバージョンが保証されないため、actions/setup-node（SHA 固定、
      # update-external.yml と同一 SHA）で明示的に 24 系へ固定する。
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      # ビルドキャッシュ（#551 と同一設計、job family prefix は openapi-ts-）。
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: openapi-ts-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            openapi-ts-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: "openapi-ts.sh（stage 1: gen-openapi --check、stage 2: schema.d.ts 鮮度検証、stage 3: tsc --noEmit）"
        run: bash scripts/openapi-ts.sh

      # TASK-6.2（#55）: openapi-ts.sh の「tsc --noEmit が成功すること」だけでは
      # 生成型が実質的な制約として機能しているかを検証できないため、意図的な型
      # 不一致が確実にエラー検出されることを陰性対照として常設検証する
      # （docs/design/openapi-typescript-pipeline.md 参照）。
      - name: "openapi-ts-negative.sh（陰性対照: 意図的な型不一致の検出を検証）"
        run: bash scripts/openapi-ts-negative.sh

  # --------------------------------------------------
  # ワークフロー静的検証（TASK-15、#180）: `.github/workflows/*.yml` を actionlint で
  # 検証し、式インジェクション（OWASP A03）・構文誤り・needs 参照切れ等のワークフロー
  # 変更退行を機械検知するゲート。PR #98 以降「環境未導入のため未実施」と記録され続けて
  # いた検証を CI 常設化する。Go 製単一バイナリで cargo 非依存のため rustup 同期は不要。
  # バージョン + SHA256 pin は scripts/actionlint.sh の定数を単一真実源とする
  # （scripts/fuzz.sh の PINNED_NIGHTLY と同じパターン）。schedule（日次 dep-audit のみを
  # 走らせる方針）からは除外する（無駄なジョブ実行を避ける原則、.claude/rules/ci.md）。
  # --------------------------------------------------
  actionlint:
    name: actionlint（ワークフロー静的検証）
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #551）。
    # バイナリ導入は ${HOME}/.local/bin +
    # GITHUB_PATH 追記で完結しランナー永続性に依存しない（使い捨て VM では
    # 冪等スキップ判定が常に不成立になり毎回インストールされるだけ）。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # サプライチェーン考慮（OWASP A08）: バージョン + SHA256 の二重 pin で取得し、
      # checksum 不一致は即失敗（fail-closed）。pin 値は scripts/actionlint.sh の定数を
      # 単一真実源として読み取るため、バージョン更新時は同スクリプトの修正のみで追随する。
      - name: Ensure actionlint (pinned, SHA256 verified)
        run: |
          set -euo pipefail
          version="$(grep -oP '(?<=^ACTIONLINT_VERSION=")[^"]+' scripts/actionlint.sh)"
          sha256="$(grep -oP '(?<=^ACTIONLINT_SHA256_LINUX_AMD64=")[^"]+' scripts/actionlint.sh)"
          if command -v actionlint >/dev/null 2>&1 && [ "$(actionlint -version | head -n1)" = "${version}" ]; then
            exit 0
          fi
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          curl --proto '=https' --tlsv1.2 -fsSL -o "${workdir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  ${workdir}/actionlint.tar.gz" | sha256sum -c -
          tar xzf "${workdir}/actionlint.tar.gz" -C "${workdir}" actionlint
          mkdir -p "${HOME}/.local/bin"
          install -m 755 "${workdir}/actionlint" "${HOME}/.local/bin/actionlint"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: scripts/actionlint.sh（.github/workflows/*.yml 検証）
        run: bash scripts/actionlint.sh

      - name: scripts/tests/run-actionlint-tests.sh（セルフテスト・陰性対照）
        run: bash scripts/tests/run-actionlint-tests.sh

  # --------------------------------------------------
  # fuzz smoke（TASK-15.3-1、#87）: crates/http/fuzz（root workspace から exclude 済み、
  # pay-for-what-you-use）の全 fuzz target を短時間（既定 60 秒/target）だけ実行し、
  # パーサのパニック・メモリ不正への回帰を CI 常設で検知する。ビルドは pinned nightly +
  # ASan 計装で通常ビルドより重いため timeout を厚めに確保する。
  # 長時間スクリーニング・検出欠陥の修正は #88（TASK-15.3-2）のスコープ。schedule（日次
  # dep-audit のみを走らせる方針）からは除外する（無駄なジョブ実行を避ける原則、
  # .claude/rules/ci.md）。
  # --------------------------------------------------
  fuzz-smoke:
    name: fuzz smoke（cargo-fuzz、nightly pinned）
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #553。置換方針は #551 で確立）。
    # pinned nightly + ASan 計装ビルドはコールドキャッシュだと重いため、キャッシュ
    # miss 時の実測は本移行 PR の CI 実行が兼ねる（30 分に収まらない場合は
    # timeout-minutes 延長を優先検討し、それでも成立しなければ分割 issue 化する。
    # イシュー #553 実施内容 3）。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#553）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （#551 の fmt/clippy ジョブと同一方針・同一 SHA）。pinned nightly の導入は
      # 次ステップ（scripts/fuzz.sh の PINNED_NIGHTLY を単一真実源とする既存手順）が
      # 担うため、ここでは stable のみ同期する。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # ビルドキャッシュ（#551 と同一設計、job family prefix は fuzz-smoke-）。
      # cargo-fuzz は crates/http/fuzz（standalone workspace）内でビルドするため、
      # ルート target ではなく crates/http/fuzz/target をキャッシュ対象にする。
      - name: Cache cargo registry and fuzz target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/http/fuzz/target
          # scripts/fuzz.sh を key に含めるのは PINNED_NIGHTLY バンプ時に旧 nightly の
          # ビルドキャッシュを引きずらないため（stable の cachekey は nightly の
          # バージョンを反映しない）。
          key: fuzz-smoke-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml', 'scripts/fuzz.sh') }}
          restore-keys: |
            fuzz-smoke-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # nightly バージョンは scripts/fuzz.sh の PINNED_NIGHTLY 定数を単一真実源とする。
      # リポジトリ既定（rust-toolchain.toml）は stable のまま変更しない
      # （.claude/rules/coding-rust.md）。
      - name: Ensure pinned nightly (scripts/fuzz.sh)
        run: |
          set -euo pipefail
          pinned="$(grep -oP '(?<=^PINNED_NIGHTLY=")[^"]+' scripts/fuzz.sh)"
          if ! rustup toolchain list | grep -qF "${pinned}"; then
            rustup toolchain install "${pinned}" --profile minimal
          fi

      # バージョン固定インストール（dep-audit / test ジョブと
      # 同じ方針。共通部品 cargo-tool-install が冪等判定・導入後の厳密一致検証を担う
      # （サプライチェーン考慮: crates.io からバージョン固定（--locked）で取得し、
      # 参照はコミット SHA 固定）。
      - name: Ensure cargo-fuzz 0.13.2
        uses: Fandhe-AI/actions/cargo-tool-install@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          tool: cargo-fuzz
          version: 0.13.2

      - name: scripts/fuzz.sh（smoke、60 秒/target）
        run: bash scripts/fuzz.sh --max-total-time 60

  # --------------------------------------------------
  # WebRTC rebind force-close e2e テスト（イシュー #507）。
  # `crates/plugin-webrtc/tests-e2e`（root workspace から exclude 済みの standalone
  # crate、`crates/http/fuzz` と同パターン）を独立 workspace としてビルド・テストする。
  # `RebindHandle::rebind` が確立済み `RTCPeerConnection` を実際に force-close することを
  # 実 ICE/DTLS シグナリングで検証する end-to-end カバレッジ。stable のみで動作する。
  # --------------------------------------------------
  webrtc-e2e:
    name: WebRTC rebind e2e（standalone crate、#507）
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #553。置換方針は #551 で確立）。
    # scripts/webrtc-e2e.sh は loopback の実 ICE/DTLS シグナリングのみで外部 STUN 等の
    # ネットワーク前提を持たないため、ホステッドの NAT 環境でも動作に影響しない。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # webrtc 依存ツリー（約 +189 クレート、PoC-5）の cold build を考慮した上限。
    # キャッシュ miss 時の実測は本移行 PR の CI 実行が兼ねる（イシュー #553 実施内容 3）。
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#553）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （#551 の fmt/clippy ジョブと同一方針・同一 SHA）。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # ビルドキャッシュ（#551 と同一設計、job family prefix は webrtc-e2e-）。
      # tests-e2e は standalone workspace（--manifest-path 実行）のため、ビルド成果物は
      # crates/plugin-webrtc/tests-e2e/target に出る。ルート target はビルドしない。
      - name: Cache cargo registry and e2e target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            crates/plugin-webrtc/tests-e2e/target
          key: webrtc-e2e-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            webrtc-e2e-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      - name: scripts/webrtc-e2e.sh
        run: bash scripts/webrtc-e2e.sh

  # --------------------------------------------------
  # 決定的マイクロベンチ（per-request alloc カウンタ、イシュー #615）。
  # 実時間ベンチ（bench-accept-exclusive.sh 等）はホステッドランナー上でも VM 個体差・
  # 共有テナンシーのノイズで微小な性能退行を検出できない場合がある
  # （docs/design/bench-hosted-runner.md）。`benches/microbench`（standalone crate、
  # `crates/http/fuzz` と同パターンで root workspace から exclude 済み）を対象に
  # `parse_request_head` → `Router::dispatch` → `Response::serialize` の同期・決定的
  # パスの alloc 回数・バイト数を計測し、コミット済みベースライン（baseline.json）との
  # しきい値ゼロのラチェット比較で退行を検知する（`unsafe-triage` ジョブと同型の判定
  # 方式）。秒オーダーの実行時間・軽量ビルドのため、方式 1（実時間ベンチ、週次）とは
  # 独立に PR/push ごと毎回実行する（docs/design/bench-hosted-runner.md 5 節 2 項の
  # 受容条件 (a) が要求するカデンツ、docs/design/deterministic-microbench.md 参照）。
  # --------------------------------------------------
  microbench:
    name: 決定的マイクロベンチ（alloc カウンタ、#615）
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # standalone crate 3 個（http/routes 依存の再ビルド + stats_alloc 系の新規依存）の
    # cold build を見込んだ上限。実測は本 PR の CI 実行が兼ねる。
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      # ビルドキャッシュ（#551 と同一設計、job family prefix は microbench-）。
      # standalone workspace のため成果物は benches/microbench/target に出る。
      - name: Cache cargo registry and microbench target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            benches/microbench/target
          key: microbench-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            microbench-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # standalone workspace のため root fmt/clippy ジョブの対象範囲に含まれない
      # （両ジョブは root `cargo fmt --check` / `cargo clippy --workspace` を実行し、
      # `[workspace] exclude` されたクレートを走査しない）。同一水準の lint を
      # このジョブ内で個別に通す。
      - name: cargo fmt --check（benches/microbench）
        run: cargo fmt --manifest-path benches/microbench/Cargo.toml --check
      - name: cargo clippy -D warnings（benches/microbench）
        run: cargo clippy --release --manifest-path benches/microbench/Cargo.toml -- -D warnings
      - name: cargo test（benches/microbench）
        run: cargo test --release --manifest-path benches/microbench/Cargo.toml

      - name: benches/microbench.sh --check
        run: bash benches/microbench.sh --check

  # --------------------------------------------------
  # コア全体の行カバレッジ計測（TASK-11.5-2、#78）。
  # 親タスク TASK-11.5（#37、docs/spec/05-tasks.md）が要求する「コア全体の自動テスト行
  # カバレッジ 80% 以上」の受け入れ確認を CI に組み込む退行ゲート。80% 未満でジョブが
  # 失敗する（scripts/coverage.sh --fail-under-lines 80）。対象クレート（コア =
  # fandhe-backend-core・fandhe-backend-http、axum-ref・fandhe-backend-plugin-* を除外）は scripts/coverage.sh
  # 側で cargo metadata から動的に決定するため、本ジョブ・スクリプト自体は
  # crates/plugin-* の増加に追従不要。
  # --------------------------------------------------
  coverage:
    name: cargo llvm-cov（コア行カバレッジ 80% ゲート）
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #553。置換方針は #551 で確立）。
    # instrumented ビルドは通常より低速のため、キャッシュ miss 時の実測は本移行 PR の
    # CI 実行が兼ねる（イシュー #553 実施内容 3）。
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    # TASK-11.4（#36）の多層防御方針を踏襲。instrumented coverage ビルドは通常ビルドより
    # 遅いため test ジョブと同程度の上限を確保する。
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # ホステッド移行（#553）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （#551 の fmt/clippy ジョブと同一方針・同一 SHA）。coverage.sh が要求する
      # llvm-tools-preview は components input で明示導入する（旧 rust-toolchain-setup
      # と同じ input 名）。
      - name: Setup Rust toolchain
        id: toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: llvm-tools-preview

      # ビルドキャッシュ（#551 と同一設計、job family prefix は coverage-）。
      # 計測前に `cargo llvm-cov clean --workspace` が coverage 成果物を除去するため、
      # 復元された stale なプロファイルデータが判定へ混入することはない。
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: coverage-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            coverage-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-

      # バージョン固定インストール（dep-audit / test ジョブと
      # 同じ方針。共通部品 cargo-tool-install が冪等判定・導入後の厳密一致検証を担う
      # （サプライチェーン考慮: crates.io からバージョン固定（--locked）で取得し、
      # 参照はコミット SHA 固定）。
      - name: Ensure cargo-llvm-cov 0.8.7
        uses: Fandhe-AI/actions/cargo-tool-install@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          tool: cargo-llvm-cov
          version: 0.8.7

      - name: Ensure cargo-nextest 0.9.137
        uses: Fandhe-AI/actions/cargo-tool-install@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          tool: cargo-nextest
          version: 0.9.137

      - name: coverage.sh（コア対象、80% 未満で失敗）
        run: bash scripts/coverage.sh

  # --------------------------------------------------
  # CI 完遂判定（TASK-14.1、#39、docs/spec/04-requirements.md REQ-14）:
  # fmt / clippy / test（spec が定める必須 3 条件）に加え、リポジトリ方針として
  # doc（missing_docs・rustdoc lint、TASK-11.2-2）・dep-audit（TASK-15.2）・
  # coverage（コア行カバレッジ 80% ゲート、TASK-11.5-2）・
  # unsafe-triage（unsafe 追加のラチェット検知、TASK-12.1-1、#79）・
  # pay-for-what-you-use（feature 無効時の依存・unsafe・コード 0 件検証、TASK-2.2、#19）・
  # fuzz-smoke（パーサのパニック・メモリ不正検知、TASK-15.3-1、#87）・
  # openapi-two-stage（openapi.json 鮮度検証 + 2 段階ビルド、TASK-3.2、#31）・
  # actionlint（ワークフロー静的検証、TASK-15、#180）も含む
  # 全ジョブの success を単一ジョブの成否に集約する。
  # branch protection / ruleset（scripts/setup-required-checks.sh）はこのジョブ名のみを
  # required check にすればよく、ジョブ追加時は needs に足すだけで判定対象を拡張できる。
  # 詳細な責務分界（機械判定できない「受け入れ基準充足」はレビューゲート TASK-14.3 が担う）は
  # docs/design/ci-completion-criteria.md を参照。
  # --------------------------------------------------
  ci-complete:
    name: ci-complete
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #551）。
    # branch protection の required status check は
    # ジョブ名（ci-complete）のみに紐づくため、runner 変更で空白期間は生じない。
    runs-on: ubuntu-latest
    # 組織標準（setup-repo-guards §集約ジョブ）: 本ジョブは checkout も GitHub API も
    # 使わないため、workflow レベルの contents: read すら不要。権限ゼロを明示する。
    permissions: {}
    # 失敗・スキップ時にも必ず実行して fail-closed で判定する。
    # schedule（日次 dep-audit のみ）実行時は
    # fmt/clippy/test/unsafe-triage/fuzz-smoke/webrtc-e2e/microbench/openapi-two-stage/openapi-ts が
    # 意図的に skipped になる（doc ジョブには schedule 除外の if がなく実行される既存
    # 挙動だが、ci-complete 自体が schedule 時は丸ごとスキップされるため判定ロジックには
    # 影響しない）。
    # 完遂判定の対象外（required check としては pull_request/push イベントのみを想定する）。
    if: ${{ always() && github.event_name != 'schedule' }}
    needs: [fmt, clippy, test, doc, dep-audit, coverage, unsafe-triage, pay-for-what-you-use, fuzz-smoke, webrtc-e2e, microbench, openapi-two-stage, openapi-ts, actionlint]
    timeout-minutes: 5
    steps:
      - name: 完遂判定（全 needs ジョブが success であること）
        # needs.*.result は式展開の対象だが、攻撃者制御値（github.event.* 等）ではなく
        # ジョブ結果の enum（success/failure/cancelled/skipped）に限定されるため、
        # env 経由での受け渡しはシェルインジェクション対策というより可読性のためである。
        env:
          RESULT_FMT: ${{ needs.fmt.result }}
          RESULT_CLIPPY: ${{ needs.clippy.result }}
          RESULT_TEST: ${{ needs.test.result }}
          RESULT_DOC: ${{ needs.doc.result }}
          RESULT_DEP_AUDIT: ${{ needs.dep-audit.result }}
          RESULT_COVERAGE: ${{ needs.coverage.result }}
          RESULT_UNSAFE_TRIAGE: ${{ needs.unsafe-triage.result }}
          RESULT_PAY_FOR_WHAT_YOU_USE: ${{ needs.pay-for-what-you-use.result }}
          RESULT_FUZZ_SMOKE: ${{ needs.fuzz-smoke.result }}
          RESULT_WEBRTC_E2E: ${{ needs.webrtc-e2e.result }}
          RESULT_MICROBENCH: ${{ needs.microbench.result }}
          RESULT_OPENAPI_TWO_STAGE: ${{ needs.openapi-two-stage.result }}
          RESULT_OPENAPI_TS: ${{ needs.openapi-ts.result }}
          RESULT_ACTIONLINT: ${{ needs.actionlint.result }}
        run: |
          set -euo pipefail
          ok=1
          for pair in "fmt:${RESULT_FMT}" "clippy:${RESULT_CLIPPY}" \
                      "test:${RESULT_TEST}" "doc:${RESULT_DOC}" \
                      "dep-audit:${RESULT_DEP_AUDIT}" "coverage:${RESULT_COVERAGE}" \
                      "unsafe-triage:${RESULT_UNSAFE_TRIAGE}" \
                      "pay-for-what-you-use:${RESULT_PAY_FOR_WHAT_YOU_USE}" \
                      "fuzz-smoke:${RESULT_FUZZ_SMOKE}" \
                      "webrtc-e2e:${RESULT_WEBRTC_E2E}" \
                      "microbench:${RESULT_MICROBENCH}" \
                      "openapi-two-stage:${RESULT_OPENAPI_TWO_STAGE}" \
                      "openapi-ts:${RESULT_OPENAPI_TS}" \
                      "actionlint:${RESULT_ACTIONLINT}"; do
            job="${pair%%:*}"; result="${pair#*:}"
            echo "${job}: ${result}"
            # skipped / cancelled / failure はすべて未完遂として扱う（fail-closed）
            [ "${result}" = "success" ] || ok=0
          done
          [ "${ok}" = "1" ]
