name: cache-prune

# main の旧世代ビルドキャッシュ削除（.claude/rules/ci.md「キャッシュ方針」）。
# Cargo.toml・toolchain の変更でビルドキャッシュの新世代が main に保存されると、旧世代は
# 誰も復元しないまま 7 日間残り、容量上限で数 MB のツールキャッシュまで LRU で追い出す。
# main への push で起動した CI の完了後（全ビルドジョブのキャッシュ保存後）に、同じ
# <family>-<OS> の最新世代だけを残す。
#
# ci.yml のジョブではなく workflow_run の別 workflow にしている理由: ci.yml 内のジョブは
# PR でも `if` で skipped の check-run を PR の HEAD に残す。required に含まれないこの
# check-run は、マージ前ゲート（implement-issue-tree の G0「合格判定対象チェック context の
# required 化」）で client-only チェックとして扱われ、自動マージを止める。workflow_run は
# 既定ブランチの workflow 定義だけが起動し、check-run も既定ブランチの commit に付くため、
# PR の HEAD には何も報告しない。品質ゲートではない保守ジョブのため required check には
# 含めない。

on:
  workflow_run:
    # ci.yml の `name:` との名前結合。ci.yml の name を変えるとこの workflow は黙って起動しなくなる
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: cache-prune
  cancel-in-progress: false

jobs:
  cache-prune:
    name: cache-prune（main の旧世代ビルドキャッシュ削除）
    # main への push で起動した CI に限る（schedule・workflow_dispatch・同名 head ブランチの
    # fork PR では動かさない）。CI の成否は問わない（旧 ci.yml の `always()` と同じ）。
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    # キャッシュ削除 API（DELETE /repos/{owner}/{repo}/actions/caches/{id}）に必要な最小権限。
    # 実行するコードは既定ブランチ（main）のもののみで、PR のコードはこの権限で動かない。
    permissions:
      contents: read
      actions: write
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          # actions: write のトークンを .git/config に残さない（後続は GH_TOKEN で足りる）
          persist-credentials: false

      - name: ci-cache-prune-generations.sh
        # 容量最適化であり、API の一時障害等で失敗扱いにしない（失敗時は旧世代が
        # 7 日の未使用期限で消えるのを待つだけ）。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-cache-prune-generations.sh
