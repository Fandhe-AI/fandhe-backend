name: bench-schedule

# イシュー #285（REQ-1/NFR-1、docs/spec/04-requirements.md）:
# `benches/bench-accept-exclusive.sh`（axum-ref 比 REQ-1・NFR-1・NFR-2 判定、
# TASK-1.6-1/#71・#260）は手動実行前提で CI に常設されておらず、2026-07-18 の
# 再計測 PASS 以降の性能退行を継続検知する体制がなかった
# （`benches/reports/task-1.6-1-performance.md` 申し送り）。
# 本 workflow はこれを週次 schedule + workflow_dispatch で定期実行する。
#
# なぜ ci.yml へ相乗りさせず別 workflow にするか（設計比較・詳細は
# docs/design/bench-scheduled-run.md 参照）:
#   ci.yml の日次 schedule は「dep-audit のみ走らせ、ビルドを伴うジョブは除外する」
#   という既存方針（.claude/rules/ci.md）を持つ。ベンチ計測はビルド + 専有計測を
#   伴い重いため、この方針と衝突させず別 workflow・週次実行に分離する。
#
# cron 配置（.claude/rules/ci.md「schedule 系ワークフロー同士は cron をずらして
# 負荷を分散する」）: update-external.yml（00:00 UTC 日次）・ci.yml（00:30 UTC
# 日次）と重ならない `0 2 * * 0`（日曜 02:00 UTC = 11:00 JST、週次・一次判定）を
# 使う。イシュー #614 で月次二次判定を新設し、`0 4 1 * *`（毎月 1 日 04:00 UTC）を
# 追加した（日曜と重なる月初でも `concurrency: bench-schedule` の直列化により
# 同時実行しない）。
#
# 判定方式（イシュー #614、`docs/design/bench-p95-criteria.md`）:
#   一次判定（axum 比）は PASS（0）/ FAIL（1、退行確定）/ BLOCKED（2、計測不能）/
#   INCONCLUSIVE（3、判定不能帯・多数決不成立）の 4 値。p95 のみ `P95_BAND=1` で
#   3 帯域判定（PASS/INCONCLUSIVE/FAIL）を有効化し、`MAJORITY_TRIALS=3`
#   （`benches/lib/exclusive.sh` の `nfr6_run_with_majority`）で最大 3 試行の
#   多数決へ拡張した（旧 `FAIL_RETRIES=1` の「2 連続 FAIL で退行確定」規約から
#   置き換え）。FAIL（1）または INCONCLUSIVE（3）確定時は、直近の成功 run の
#   コミットを pre として `bench-pair.sh`（交互ペア測定による二次判定、#613）で
#   退行帰属を試みる「追撃」ステップを実行し、Issue 本文へ結果を添付する
#   （二次判定の結果は一次判定・ジョブの成否を変更しない。証跡のみ）。
#   月次無条件二次判定（`bench-pair-monthly` ジョブ）は、恒久策（トリガ (iii)
#   監視ロジック）が未実装の「baseline・core が同方向に悪化する run を検知できない」
#   弱点（`docs/design/bench-hosted-runner.md` 7 節 (iii)）への暫定対応として、
#   実時間退行クラスを定期的に守る役割を持つ。#616 較正ランは完了済み（標本は
#   `benches/reports/issue616-hosted-runner-calibration.md` 9〜10 節、固定 ref・
#   同一コミット 797245a5 で mode=primary × 5・mode=pair × 2。実測発火のあった
#   判定経路のしきい値は同較正ランで確定・値の変更なし。未発火の防御パラメータ
#   （MAJORITY_TRIALS の多数決経路等）は暫定値のまま維持で確定扱いしない —
#   区分は同レポート 11 節参照）だが、
#   恒久策（トリガ (iii) 監視ロジック）は引き続き未実装の保留のため、本月次実行は
#   当面主手段のまま継続する。
#
# INCONCLUSIVE を PASS へ丸めない・二次判定の PASS が一次判定の FAIL を上書き
# しない、という不変条件は `docs/design/bench-p95-criteria.md` 3.1 節を参照。
#
# CARGO_TARGET_DIR のジョブローカル固定（イシュー #480）: 2026-08-02 実行
# （run 30729910081）で `cargo build --release` 成功直後に
# `target/release/axum-ref` が見つからず BLOCKED になる事象が発生した。
# 調査の結果、（当時の）self-hosted runner フリートは同一 org（Fandhe-AI）の他リポジトリ
# （fandhe-frontend）の CI が明示的に前提とするとおり、ホスト共有の
# `CARGO_TARGET_DIR=/cargo-target` をジョブに注入する構成であることが濃厚
# （一次証拠・タイムライン・確度は
# benches/reports/issue480-target-dir-investigation.md 参照）。この場合
# `cargo build` の成果物はリポジトリ直下の `target/` ではなく
# `/cargo-target` 配下に生成され、`benches/lib/common.sh` 等が既定で参照する
# `${WORKSPACE_ROOT}/target/release/...` には最初から存在しない。
#
# 各ジョブは `env: CARGO_TARGET_DIR: ${{ github.workspace }}/target` をジョブ全体へ
# 設定する（導入当時はホスト共有 `/cargo-target` からの隔離が目的。
# fandhe-frontend #1192 で実証済みの「共有 target 上の成果物汚染」リスクの
# 回避も兼ねた。ホステッド移行〔#554〕後の使い捨て VM では既定と等価だが、
# 維持判断の根拠はジョブ定義側のコメント参照）。`benches/lib/common.sh` の
# `BENCH_TARGET_DIR` 導出は
# `CARGO_TARGET_DIR` env を最優先で採用するため、本設定によりベンチ側の
# バイナリパス既定値もこのジョブローカル target と自動的に一致する。
#
# 退行検知時の扱い（フェイルクローズ）: ジョブを失敗（赤）させ、かつ schedule /
# workflow_dispatch 実行時は `bench-regression` ラベルで Issue を自動起票する
# （improvement-proposal 規約の「自動レイヤ（承認不要）」に該当）。イシュー #539 で
# ラベル冪等作成・重複判定・起票の共通部品
# `Fandhe-AI/actions/idempotent-issue`（SHA 固定）呼び出しへ置換した（本文・タイトル
# 組み立てのみ本 workflow 側に残す 2 ステップ構成）。ci.yml dep-audit ジョブの
# audit-triage 起票は advisory ID ごとの可変回数ループを伴うため置換対象外
# （`ci.yml` 側コメント・`docs/design/bench-scheduled-run.md` 参照）。

on:
  schedule:
    - cron: "0 2 * * 0"
    - cron: "0 4 1 * *"
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          primary（週次一次判定、axum 比・多数決）/ pair（月次二次判定、
          直近成功 run との交互ペア測定）。schedule 実行時は cron 文字列
          （github.event.schedule）で自動判別するため本 input は無視される。
        required: false
        default: primary
        type: choice
        options:
          - primary
          - pair

permissions:
  contents: read

concurrency:
  group: bench-schedule
  cancel-in-progress: false

jobs:
  bench-accept:
    name: REQ-1/NFR-1 性能ベンチ（専有計測・週次・一次判定）
    # 週次 cron（`0 2 * * 0`）または workflow_dispatch で mode=primary（既定）の
    # ときのみ実行する。`github.event.schedule` は文字列完全一致で判定する
    # （空白・書式の違いも別文字列として扱われるため、`on.schedule` の cron 文字列と
    # 1 文字違わず揃える。値が一致しないと本ジョブが常に skip される「静かな見逃し」に
    # なるため、`on:` の 2 つの cron と本ファイル内の比較文字列は必ず同時に変更する）。
    if: |
      github.event.schedule == '0 2 * * 0' ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'primary' || github.event.inputs.mode == ''))
    # public 化に伴う組織 runner 方針（Fandhe-AI/actions リポジトリの docs/runner-policy.md）
    # により GitHub ホステッドランナーへ移行（イシュー #554）。判定は axum-ref 比の
    # 相対値で同一 VM 内比較のためハード差の一次影響は相殺される。専有ロック・静穏待機
    # 機構は使い捨て VM では実質 no-op だが無害のため維持する（方針決定の全文は
    # イシュー #554 コメント参照）。共有テナンシー起因で閾値判定が再現しない場合は
    # 既設のフェイルクローズ運用（MAJORITY_TRIALS=3 + bench-regression 自動起票）が
    # 実測データとして可視化するため、その時点で再ベースライン化を判断する。
    runs-on: ubuntu-latest
    # Issue 起票に加え、追撃（退行帰属のための参照コミット解決）用に
    # `actions: read` を付与する（イシュー #614。直近の成功 run の head SHA を
    # `gh api` で取得するために必要。workflow 全体は `contents: read` を維持、
    # 最小権限・ジョブ単位付与、ci.yml dep-audit ジョブと同一パターン）。
    permissions:
      contents: read
      issues: write
      actions: read
    # worst-case 予算（PR #291 Bugbot 指摘対応を踏襲。イシュー #614 で
    # MAJORITY_TRIALS=3（最大 3 試行）+ 追撃（pre ビルド + bench-pair.sh 8 ペア測定）を
    # 追加したため再積算する）:
    #   (1) 専有ロック取得待ち（`acquire_exclusive_lock` の `flock -w`）      最大 30 分
    #   (2) 計測前の静穏待機（`wait_for_quiescence`）                        最大 30 分
    #   (3) 多数決 2・3 回目前の静穏待機（`nfr6_run_with_majority` 内、
    #       最大 2 回）                                                     最大 60 分
    # に加え、release ビルド ×2（workspace 一括・core-bench example）と最大 3 回の
    # 計測試行の実処理時間、および FAIL/INCONCLUSIVE 確定時のみ追加で発生する
    # 追撃（pre コミットの release ビルド 1 回 + `bench-pair.sh` の 8 ペア×2 バイナリ
    # ×RUNS=5 セッション計測）を要する。(1)〜(3) の待機予算だけで 120 分に達し
    # うるため、旧 240 分では追撃分の実処理時間を含めると worst-case がジョブ
    # タイムアウトを超えうる。300 分へ延長し、待機予算 120 分 + ビルド・計測・追撃の
    # 実処理分のマージンを確保する（.claude/rules/ci.md「全ジョブに
    # timeout-minutes を設定する」多層防御。実測に基づく最終確定は
    # workflow_dispatch 検証（push 前フェーズのため本 PR には含まれない）を待つ、
    # PR 本文の対象外事項を参照）。
    timeout-minutes: 300
    # ジョブローカル target ディレクトリ（イシュー #480、上部コメント参照）。
    # ホステッドの使い捨て VM では既定と等価だが、`benches/lib/common.sh` の
    # `BENCH_TARGET_DIR` 導出（CARGO_TARGET_DIR 最優先）の明示性と下記診断ステップの
    # 意味を保つため維持する（削除しない判断の記録はイシュー #554 コメント参照）。
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout
        # 他ジョブ（ci.yml fmt/clippy/test 等）と同一コミット SHA で固定する
        # （サプライチェーン考慮、.claude/rules/security.md）。
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # 恒久の診断ステップ（イシュー #480）: 「ビルド成功直後にバイナリが
      # 見つからない」系の障害は再現性が低く、事後調査が困難だった
      # （#476 のトリアージで既存ログから CARGO_TARGET_DIR の実測値が
      # 追えなかった）。今後同種の障害が起きた場合に runner 環境の実効
      # target ディレクトリをログから即座に確認できるよう、恒久的に記録する。
      - name: 実効 target dir の診断記録（イシュー #480）
        run: |
          echo "CARGO_TARGET_DIR(env)=${CARGO_TARGET_DIR:-<unset>}"
          echo "github.workspace=${{ github.workspace }}"
          rustc -vV || true
          cargo --version || true

      # ホステッド移行（#554）: rust-toolchain-setup → dtolnay/rust-toolchain 置換
      # （ci.yml の各ジョブと同一方針・同一 SHA、イシュー #551 で確立）。
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # oha（HTTP 負荷生成、benches/README.md 前提ツール）を冪等・バージョン固定で
      # インストールする。共通部品 cargo-tool-install が「導入済み同一バージョンなら
      # スキップ」の冪等判定と導入後の厳密一致検証を担う（サプライチェーン考慮:
      # crates.io からバージョン固定（--locked）で取得し、参照はコミット SHA 固定。
      # 既存 cargo-nextest/cargo-deny 等の導入ステップと同じ方針）。
      #
      # バージョンは 1.15.0 に固定する。既存の計測レポート（`benches/reports/
      # task-1.6-1-performance.md` 等）・受け入れ検証（`docs/acceptance/`）がすべて
      # oha 1.15.0 で取得されており、負荷生成器のバージョンを跨いで axum-ref 比の
      # RPS を比較しないため（当初指定の 1.9.1 は crates.io に存在しないバージョンで、
      # `cargo install` が `could not find oha in registry` で必ず失敗していた）。
      - name: Ensure oha 1.15.0
        uses: Fandhe-AI/actions/cargo-tool-install@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          tool: oha
          version: 1.15.0

      # `benches/bench-accept-exclusive.sh` は専有ロック取得後にビルド → 静穏確認 →
      # 計測の順で実行する（doc comment 参照）。本ステップ自体は事前ビルドを
      # 行わない（wrapper が内部で cargo build する）。
      - name: bench-accept-exclusive.sh（MAJORITY_TRIALS=3 で最大 3 試行の多数決）
        id: bench
        # 終了コード: 0=PASS、1=FAIL（退行確定）、2=BLOCKED（計測不能）、
        # 3=INCONCLUSIVE（判定不能帯・多数決不成立、イシュー #614）。
        # フェイルクローズのため `set -e` は使わず、終了コードを捕捉してから
        # ジョブを明示的に失敗させる（次の起票ステップを確実に実行するため）。
        run: |
          set +e
          MAJORITY_TRIALS=3 REPORT_MD="${RUNNER_TEMP}/bench-report.md" bash benches/bench-accept-exclusive.sh
          echo "status=$?" >> "${GITHUB_OUTPUT}"

      # --- 追撃（退行帰属のための二次判定、イシュー #614） ---
      # FAIL（1）または INCONCLUSIVE（3）確定時のみ実行する。二次判定の結果は
      # 一次判定・ジョブの成否を変更しない（Issue 本文への添付のみ、証跡目的）。

      - name: 追撃用の参照コミット解決（直近の成功 run の head SHA）
        id: chase_ref
        if: always() && steps.bench.outcome == 'success' && (steps.bench.outputs.status == '1' || steps.bench.outputs.status == '3') && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        # 月次側（`ref` ステップ）と同じ複数 run 走査で解決する（cursor[bot]
        # レビュー Medium 指摘対応: per_page=1 だと main に変更がない週・同一
        # SHA 再実行では直近成功 run の head_sha が現在の SHA と一致しただけで
        # 追撃が skip され、FAIL/INCONCLUSIVE Issue から二次判定の証跡が
        # 恒常的に欠落する。per_page=10 で現在の SHA と異なる最初の成功 run を
        # 選択し、古いベースラインが存在する限り追撃を実行できるようにする）。
        # `--jq` に jq オプション（`--arg`）は渡せないため JSON 取得と jq 抽出を
        # 分離する（月次 `ref` ステップと同一の根拠・同一のパターン）。
        run: |
          set -uo pipefail
          # shellcheck disable=SC2016  # '$cur' は jq 側の変数参照（--arg cur で束縛）
          ref_sha=""
          if api_json="$(gh api "repos/${{ github.repository }}/actions/workflows/bench-schedule.yml/runs?status=success&branch=main&per_page=10" 2>/dev/null)"; then
            ref_sha="$(printf '%s' "${api_json}" | jq -r --arg cur "${{ github.sha }}" '[.workflow_runs[].head_sha] | map(select(. != $cur)) | .[0] // empty' 2>/dev/null || true)"
          fi
          if [ -z "${ref_sha}" ]; then
            echo "resolved=false" >> "${GITHUB_OUTPUT}"
            echo "追撃不能: 現在の SHA と異なる直近の成功 run が見つかりません（初回実行・gh api / jq 呼び出し失敗、または同一 SHA の成功 run のみが 10 件連続）。silent skip せずログに記録します" >&2
          else
            echo "resolved=true" >> "${GITHUB_OUTPUT}"
            echo "ref_sha=${ref_sha}" >> "${GITHUB_OUTPUT}"
            echo "追撃対象の参照コミット: ${ref_sha}"
          fi

      - name: 参照コミットの checkout（追撃）
        if: steps.chase_ref.outputs.resolved == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ steps.chase_ref.outputs.ref_sha }}
          path: pre-src

      - name: pre バイナリのビルド（追撃、core-bench example）
        if: steps.chase_ref.outputs.resolved == 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pre-target
        run: |
          cargo build --release --example core-bench -p fandhe-backend-core --manifest-path "${{ github.workspace }}/pre-src/Cargo.toml"

      - name: bench-pair.sh（追撃、交互ペア測定による二次判定）
        id: chase_pair
        if: steps.chase_ref.outputs.resolved == 'true'
        run: |
          set +e
          BIN_A="${{ runner.temp }}/pre-target/release/examples/core-bench" \
          BIN_B="${{ github.workspace }}/target/release/examples/core-bench" \
          CPU_PROBE=1 \
          REPORT_MD="${RUNNER_TEMP}/bench-pair-chase-report.md" \
          bash benches/bench-pair.sh
          echo "status=$?" >> "${GITHUB_OUTPUT}"

      - name: 退行・計測不能検知時の Issue 本文組み立て
        id: bench_issue_body
        # improvement-proposal 規約（.claude/rules/improvement-proposal.md）の
        # 「自動レイヤ（承認不要）」: フレームワーク自身の自動監査機構による能動的な
        # 提示。schedule / workflow_dispatch 実行時のみ（本 workflow はこの 2
        # トリガーしか持たないため実質常に真だが、他ジョブとの記述一貫性のため明示する）。
        #
        # `steps.bench.outcome == 'success'` を必須条件に加える（PR #291 Bugbot 指摘
        # 対応）: checkout / rustup 導入 / oha 導入のいずれかが失敗すると「bench」
        # ステップ自体が skip され、`steps.bench.outputs.status` は空文字になる。
        # 空文字は `!= '0'` を満たしてしまうため、この条件だけでは
        # bench-accept-exclusive.sh が一度も実行されていないのに
        # `bench-regression` Issue が誤って自動起票されてしまう
        # （前段の環境構築失敗を性能退行として誤報告する）。
        #
        # 本ステップはタイトル・本文の組み立てのみを担い、ラベル冪等作成・重複判定・
        # 実際の起票は次ステップの共通部品 idempotent-issue へ委譲する（イシュー #539）。
        if: always() && steps.bench.outcome == 'success' && steps.bench.outputs.status != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          BENCH_STATUS: ${{ steps.bench.outputs.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CHASE_RESOLVED: ${{ steps.chase_ref.outputs.resolved }}
          CHASE_REF_SHA: ${{ steps.chase_ref.outputs.ref_sha }}
          CHASE_PAIR_STATUS: ${{ steps.chase_pair.outputs.status }}
        run: |
          set -euo pipefail

          case "${BENCH_STATUS}" in
            1)
              title_prefix="bench-regression: REQ-1/NFR-1 性能退行を検知"
              verdict="FAIL（退行確定。MAJORITY_TRIALS=3 の多数決で FAIL が過半数）"
              ;;
            3)
              # イシュー #614: 判定不能帯・多数決不成立を PASS/FAIL いずれへも
              # 丸めず、専用タイトルで区別する（`docs/design/bench-p95-criteria.md`
              # 3.1 節「INCONCLUSIVE を PASS へ丸めない」不変条件）。
              title_prefix="bench-regression: REQ-1/NFR-1 判定不能（要再計測・INCONCLUSIVE）"
              verdict="INCONCLUSIVE（p95 が判定不能帯に収まる、または多数決が割れて確定できない。二次判定（追撃）の結果を参照して再計測要否を判断すること）"
              ;;
            *)
              title_prefix="bench-regression: REQ-1/NFR-1 計測が BLOCKED（計測不能）"
              verdict="BLOCKED（専有ロック取得不能・ビルド失敗・静穏未達・baseline / CORE_BIN バイナリ未整備のいずれか。計測不能自体も継続検証体制の喪失として扱う）"
              ;;
          esac

          echo "title=${title_prefix}" >> "${GITHUB_OUTPUT}"

          body_file="${RUNNER_TEMP}/bench-issue-body.md"
          {
            echo "## 検知内容"
            echo
            echo "- 判定: ${verdict}"
            echo "- 実行: ${RUN_URL}"
            echo "- ワークフロー: bench-schedule.yml（週次 schedule または workflow_dispatch、一次判定）"
            echo
            echo "## 追撃（退行帰属のための二次判定、bench-pair.sh）"
            echo
            if [ "${CHASE_RESOLVED:-false}" = "true" ]; then
              echo "- 参照コミット（pre）: ${CHASE_REF_SHA}"
              if [ -n "${CHASE_PAIR_STATUS:-}" ]; then
                case "${CHASE_PAIR_STATUS}" in
                  0) echo "- 二次判定: PASS（非退行。ただし一次判定の結果は上書きしない）" ;;
                  1) echo "- 二次判定: FAIL（退行を再現。詳細は下記計測レポート参照）" ;;
                  3) echo "- 二次判定: INCONCLUSIVE（採用ペア数不足等で確定できず）" ;;
                  *) echo "- 二次判定: BLOCKED（追撃自体が計測不能。終了コード ${CHASE_PAIR_STATUS}）" ;;
                esac
              else
                echo "- 二次判定: 実行されませんでした（bench-pair.sh 自体が起動しなかった可能性）"
              fi
            elif [ "${BENCH_STATUS}" = "1" ] || [ "${BENCH_STATUS}" = "3" ]; then
              echo "- 追撃不能: 直近の成功 run が見つからない、または現 SHA と同一のため参照コミットを解決できませんでした"
            else
              echo "- 追撃未実施: 一次判定が BLOCKED（計測不能）のため対象外です（追撃は一次判定 FAIL/INCONCLUSIVE 確定時のみ実行、\`chase_ref\` ステップ自体が skip されました）"
            fi
            echo
            echo "## 一次対応"
            echo
            echo "1. \`REPORT_MD=... MAJORITY_TRIALS=3 bash benches/bench-accept-exclusive.sh\` を手動再実行し、退行の再現を確認する"
            echo "2. 上記「追撃」の二次判定結果（PASS/FAIL/INCONCLUSIVE/BLOCKED）を退行帰属の参考にする"
            echo "3. 再現しない場合は環境ノイズと判断し、本 Issue をクローズする"
            echo "4. 再現する場合は .claude/rules/improvement-proposal.md に従い対応方針を検討する"
            echo
            echo "## 計測レポート（一次判定。上記「判定」欄が権威）"
            echo
            echo "MAJORITY_TRIALS=3 の多数決により、下記レポートには最大 3 個の"
            echo "「## 結論」セクション（試行ごと）が記録されうる。最終確定した判定は"
            echo "本 Issue 冒頭の「判定」欄（多数決の最終結果）であり、レポート中の"
            echo "個々の「## 結論」（各試行単体の結果）ではない。"
            echo
            if [ -s "${RUNNER_TEMP}/bench-report.md" ]; then
              cat "${RUNNER_TEMP}/bench-report.md"
            else
              echo "（レポートファイルが生成されませんでした）"
            fi
            if [ -s "${RUNNER_TEMP}/bench-pair-chase-report.md" ]; then
              echo
              echo "## 計測レポート（追撃・二次判定。証跡のみ、一次判定を上書きしない）"
              echo
              cat "${RUNNER_TEMP}/bench-pair-chase-report.md"
            fi
          } >"${body_file}"

      - name: 退行・計測不能検知時の Issue 起票
        # ラベル冪等作成・重複判定（同一ラベルの open Issue 検索）・起票を共通部品
        # `Fandhe-AI/actions/idempotent-issue` へ委譲する（イシュー #539、参照は
        # コミット SHA 固定。.claude/rules/security.md サプライチェーン考慮）。
        # `steps.bench_issue_body.outcome == 'success'` を追加し、本文組み立てが
        # 走っていない（前段条件不成立で skip された）場合に body-file 不在のまま
        # action を実行しないようにする（フェイルクローズの明確化）。
        #
        # 重複検索の失敗時、共通部品は旧実装の `|| echo "0"`（フェイルオープン。
        # gh 障害を「既存なし」と誤判断し重複起票しうる）と異なりフェイルクローズで
        # 異常終了する（重複起票防止を優先する安全側の挙動変更）。起票失敗
        # （`gh issue create` 相当）時も本ステップは fail するが、判定結果（ジョブの
        # 成功/失敗）は次の「判定結果でジョブを終了」ステップが `if: always()` で
        # 独立に決めるため、本ステップの成否は判定結果を変えない。
        if: always() && steps.bench.outcome == 'success' && steps.bench_issue_body.outcome == 'success' && steps.bench.outputs.status != '0' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: Fandhe-AI/actions/idempotent-issue@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          label: bench-regression
          label-color: B60205
          label-description: "週次ベンチ（bench-schedule.yml）の REQ-1/NFR-1 退行・計測不能・判定不能検知（イシュー #285、#614）"
          search-query: bench-regression
          title: ${{ steps.bench_issue_body.outputs.title }}
          body-file: ${{ runner.temp }}/bench-issue-body.md

      - name: 判定結果でジョブを終了（フェイルクローズ）
        if: always()
        env:
          BENCH_STATUS: ${{ steps.bench.outputs.status }}
          BENCH_OUTCOME: ${{ steps.bench.outcome }}
        run: |
          # `bench` ステップが skip された場合（前段の checkout / rustup 導入 /
          # oha 導入の失敗）は `BENCH_STATUS` が空文字になる。空文字のまま
          # `exit "${BENCH_STATUS}"` すると bash が非数値引数でエラー終了し、実際の
          # ベンチ判定を反映しない不明瞭な失敗になる（PR #291 Bugbot 指摘対応）。
          # ジョブは前段の失敗により既に failure 状態のため、ここでは判定結果が
          # 存在しない旨を明示して 1 で終了するに留め、既存の失敗状態を変えない。
          if [ "${BENCH_OUTCOME}" != "success" ] || [ -z "${BENCH_STATUS}" ]; then
            echo "bench-accept-exclusive.sh は実行されていません（前段ステップの失敗等）。判定結果を反映できないため終了します" >&2
            exit 1
          fi
          # 0（PASS）以外はすべてジョブを非 0 終了させる（1=FAIL・2=BLOCKED・
          # 3=INCONCLUSIVE のいずれも fail-closed。イシュー #614 で 3 を追加したが
          # 「PASS 以外は赤」という既存契約は変えない）。
          echo "bench-accept-exclusive.sh 終了コード: ${BENCH_STATUS}"
          exit "${BENCH_STATUS}"

  bench-pair-monthly:
    name: REQ-1/NFR-1 性能ベンチ（月次・二次判定・無条件交互ペア測定）
    # イシュー #614: `docs/design/bench-hosted-runner.md` 7 節 (iii)（baseline・
    # core が同方向に悪化する run を一次判定〔axum 比〕だけでは検知できない構造的
    # 弱点）への暫定対応。恒久策（run 系列の統計的監視、トリガ (iii)）は引き続き
    # 未実装の保留であり、その間は本月次実行が主手段。#616 較正ランは完了済み
    # （mode=primary × 5・mode=pair × 2、標本は
    # `benches/reports/issue616-hosted-runner-calibration.md` 9〜10 節）だが、
    # 恒久策の実装自体は別途申し送り事項のまま（同文書 8 節）。
    #
    # 月次 cron（`0 4 1 * *`）または workflow_dispatch で mode=pair のときのみ
    # 実行する（`bench-accept` ジョブの `if:` と同じ「schedule 文字列は完全一致で
    # 判定・変更時は on: の cron と同時に揃える」注意点が適用される）。
    if: |
      github.event.schedule == '0 4 1 * *' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'pair')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    # worst-case 予算: 専有実行枠は使わない（無条件・単発測定のため flock/静穏確認を
    # 経由しない）。pre/cur 2 バイナリの release ビルド + `bench-pair.sh`
    # （PAIRS=8 既定・4 エンドポイント・RUNS=5 既定のセッション計測 ×16 セッション）の
    # 実処理時間が主要因。週次ジョブの (3) 多数決分の待機がない分、週次より短い
    # worst-case を見込み 90 分とする（実測に基づく最終確定は workflow_dispatch
    # 検証を待つ、PR 本文の対象外事項を参照）。
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout（cur = 現在の HEAD）
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Ensure oha 1.15.0
        uses: Fandhe-AI/actions/cargo-tool-install@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          tool: oha
          version: 1.15.0

      - name: cur バイナリのビルド（core-bench example）
        run: |
          cargo build --release --example core-bench -p fandhe-backend-core

      - name: 参照コミット解決（直近の成功 run の head SHA を pre とする）
        # イシュー #614 codex-review P1 指摘対応: per_page=1（直近 1 件）のみを
        # 参照すると、main に変更がない週や同一 SHA 再実行後の月次実行のように
        # 直近の成功 run の head_sha が現在の head_sha と偶然一致するだけで
        # resolved=false（BLOCKED 相当）になり、「恒久策（トリガ (iii) 監視ロジック）
        # 未実装の間の繋ぎとして毎月無条件に交互ペア測定を実行する」運用契約
        # （`docs/design/bench-hosted-runner.md` 5 節 2 項）が正常運用でも
        # 恒常的に破られる。
        # per_page=10 で直近複数件を取得し、現在の SHA と異なる最初の成功 run を
        # 参照コミットとして選択する（同一 SHA の連続成功 run が 10 件に満たない
        # 限り解決できる。それでも見つからない場合のみ BLOCKED 扱いとする）。
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2016  # '$cur' は jq 側の変数参照（--arg cur で束縛）で、シェル展開ではない（意図的な単一引用）
          # `gh api` の `--jq` は jq 式のみを受け付け、jq 自体のオプション（`--arg` 等）は
          # 渡せない（`unknown flag: --arg` で失敗する）。current SHA を安全にバインドする
          # には `--arg` が必須のため、`gh api` は JSON 取得専用にとどめ `jq` へパイプする
          # （イシュー #614、codex-review P1 指摘対応。従来は `--jq --arg ...` が常に失敗し、
          # stderr 破棄 + `|| true` で握りつぶされて ref_sha が常に空 → 月次二次判定が
          # 恒常的に BLOCKED になっていた）。`set -e` 不使用（本ステップ限定）+
          # 明示的なパイプライン失敗検査で、gh api / jq いずれの失敗も
          # ハードクラッシュさせず resolved=false（BLOCKED 扱い）へ正常降格させる
          # （fail-closed。API 一時障害でジョブ全体を失敗させない趣旨は変更しない）。
          ref_sha=""
          if api_json="$(gh api "repos/${{ github.repository }}/actions/workflows/bench-schedule.yml/runs?status=success&branch=main&per_page=10" 2>/dev/null)"; then
            ref_sha="$(printf '%s' "${api_json}" | jq -r --arg cur "${{ github.sha }}" '[.workflow_runs[].head_sha] | map(select(. != $cur)) | .[0] // empty' 2>/dev/null || true)"
          fi
          if [ -z "${ref_sha}" ]; then
            echo "resolved=false" >> "${GITHUB_OUTPUT}"
            echo "参照コミットを解決できません（現 SHA と異なる直近の成功 run が見つかりません）。二次判定を実行できないため BLOCKED として扱います" >&2
          else
            echo "resolved=true" >> "${GITHUB_OUTPUT}"
            echo "ref_sha=${ref_sha}" >> "${GITHUB_OUTPUT}"
          fi

      - name: 参照コミットの checkout（pre）
        if: steps.ref.outputs.resolved == 'true'
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ steps.ref.outputs.ref_sha }}
          path: pre-src

      - name: pre バイナリのビルド（core-bench example）
        if: steps.ref.outputs.resolved == 'true'
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/pre-target
        run: |
          cargo build --release --example core-bench -p fandhe-backend-core --manifest-path "${{ github.workspace }}/pre-src/Cargo.toml"

      - name: bench-pair.sh（月次・無条件二次判定）
        id: pair
        if: steps.ref.outputs.resolved == 'true'
        run: |
          set +e
          BIN_A="${{ runner.temp }}/pre-target/release/examples/core-bench" \
          BIN_B="${{ github.workspace }}/target/release/examples/core-bench" \
          CPU_PROBE=1 \
          REPORT_MD="${RUNNER_TEMP}/bench-pair-report.md" \
          bash benches/bench-pair.sh
          echo "status=$?" >> "${GITHUB_OUTPUT}"

      - name: 退行検知時の Issue 本文組み立て
        id: issue_body
        # 参照コミットが解決できなかった場合も「継続検証体制の喪失」として起票する
        # （silent skip 禁止。BLOCKED 相当の終了コード 2 を採用）。
        #
        # `steps.ref.outcome == 'success'` を必須条件に加える（cursor[bot] レビュー
        # 指摘対応、週次 bench-accept ジョブの `steps.bench.outcome == 'success'`
        # ガードと同一パターン）: checkout / rustup 導入 / oha 導入 / cur バイナリの
        # ビルドのいずれかが失敗すると「ref」ステップ自体が skip され、
        # `steps.ref.outputs.resolved` は空文字になる。空文字は `!= 'true'` を
        # 満たしてしまうため、この条件だけでは前段の環境構築・ビルド失敗を
        # 「参照コミット未解決（BLOCKED）」と誤認し、resolved=false の場合と
        # 同じ理由で bench-regression Issue が誤って自動起票されてしまう。
        #
        # `steps.pair.outcome != 'success'` も起票条件に加える（PR #621 Bugbot
        # 指摘対応）: `ref` が resolved=true でも、後続の「参照コミットの
        # checkout（pre）」「pre バイナリのビルド」ステップが失敗すると、暗黙の
        # `success()` ゲートにより `pair` ステップ自体が skip され
        # `steps.pair.outcome` は `skipped` になる（`steps.pair.outputs.status`
        # は空文字）。従来の条件 `steps.pair.outcome == 'success' && ...` は
        # この場合に false のままとなり、ジョブ自体は赤くなるのに
        # bench-regression Issue が起票されない「計測不能の silent skip」を
        # 招いていた（下の「判定結果でジョブを終了」ステップの
        # `PAIR_OUTCOME != 'success'` 分岐と同一パターンで揃える）。
        if: always() && steps.ref.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.ref.outputs.resolved != 'true' || steps.pair.outcome != 'success' || steps.pair.outputs.status != '0')
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF_RESOLVED: ${{ steps.ref.outputs.resolved }}
          REF_SHA: ${{ steps.ref.outputs.ref_sha }}
          PAIR_OUTCOME: ${{ steps.pair.outcome }}
          PAIR_STATUS: ${{ steps.pair.outputs.status }}
        run: |
          set -euo pipefail

          if [ "${REF_RESOLVED:-false}" != "true" ]; then
            title_prefix="bench-regression: REQ-1/NFR-1 月次二次判定（方式 2）が BLOCKED（参照コミット未解決）"
            verdict="BLOCKED（直近の成功 run が見つからない、または現 SHA と同一のため参照コミットを解決できませんでした）"
            pair_status_num=2
          elif [ "${PAIR_OUTCOME}" != "success" ]; then
            title_prefix="bench-regression: REQ-1/NFR-1 月次二次判定（方式 2）が BLOCKED（pre 環境構築失敗）"
            verdict="BLOCKED（参照コミットの checkout または pre バイナリのビルドが失敗し、bench-pair.sh 自体を実行できませんでした）"
            pair_status_num=2
          else
            case "${PAIR_STATUS}" in
              1)
                title_prefix="bench-regression: REQ-1/NFR-1 月次二次判定（方式 2）で退行を検知"
                verdict="FAIL（交互ペア測定〔前月以降の直近成功 run 比〕で退行を検出）"
                ;;
              3)
                title_prefix="bench-regression: REQ-1/NFR-1 月次二次判定（方式 2）が判定不能（要再計測・INCONCLUSIVE）"
                verdict="INCONCLUSIVE（採用ペア数が最低ペア数を下回る等で確定できません）"
                ;;
              *)
                title_prefix="bench-regression: REQ-1/NFR-1 月次二次判定（方式 2）が BLOCKED（計測不能）"
                verdict="BLOCKED（bench-pair.sh 自体の計測不能。終了コード ${PAIR_STATUS}）"
                ;;
            esac
            pair_status_num="${PAIR_STATUS}"
          fi

          echo "title=${title_prefix}" >> "${GITHUB_OUTPUT}"
          echo "status=${pair_status_num}" >> "${GITHUB_OUTPUT}"

          body_file="${RUNNER_TEMP}/bench-pair-issue-body.md"
          {
            echo "## 検知内容（方式 2: 月次無条件交互ペア測定）"
            echo
            echo "- 判定: ${verdict}"
            echo "- 実行: ${RUN_URL}"
            echo "- ワークフロー: bench-schedule.yml（bench-pair-monthly ジョブ、月次 schedule または workflow_dispatch mode=pair）"
            if [ "${REF_RESOLVED:-false}" = "true" ]; then
              echo "- 参照コミット（pre）: ${REF_SHA}"
            fi
            echo
            echo "## 位置づけ"
            echo
            echo "本判定は一次判定（axum 比、週次 bench-accept ジョブ）とは独立した"
            echo "退行検知手段（\`docs/design/bench-hosted-runner.md\` 7 節 (iii) の暫定対応）。"
            echo "一次判定の結果を上書き・確定しない。"
            echo
            echo "## 一次対応"
            echo
            echo "1. \`BIN_A=<pre> BIN_B=<cur> REPORT_MD=... bash benches/bench-pair.sh\` を手動再実行し、退行の再現を確認する"
            echo "2. 再現しない場合は環境ノイズと判断し、本 Issue をクローズする"
            echo "3. 再現する場合は .claude/rules/improvement-proposal.md に従い対応方針を検討する"
            echo
            echo "## 計測レポート"
            echo
            if [ -s "${RUNNER_TEMP}/bench-pair-report.md" ]; then
              cat "${RUNNER_TEMP}/bench-pair-report.md"
            else
              echo "（レポートファイルが生成されませんでした）"
            fi
          } >"${body_file}"

      - name: 退行検知時の Issue 起票
        # `steps.ref.outcome == 'success'` を追加し、上記「Issue 本文組み立て」
        # ステップと同じ理由で誤起票の入口を二重に塞ぐ（本ステップ自体は
        # `steps.issue_body.outcome == 'success'` 経由で既に間接的にガードされる
        # 想定だが、週次 bench-accept ジョブの Issue 起票ステップと同一の
        # 明示ガードを揃えることで意図を明確化する）。`steps.pair.outcome !=
        # 'success'` も上記「Issue 本文組み立て」ステップと同一条件で加える
        # （PR #621 Bugbot 指摘対応。pre checkout/build 失敗による pair skip を
        # 計測不能として確実に起票する）。
        if: always() && steps.ref.outcome == 'success' && steps.issue_body.outcome == 'success' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (steps.ref.outputs.resolved != 'true' || steps.pair.outcome != 'success' || steps.pair.outputs.status != '0')
        uses: Fandhe-AI/actions/idempotent-issue@fed9c07d98367f77e5e2b63bca38843f46feee96 # main
        with:
          label: bench-regression
          label-color: B60205
          label-description: "週次ベンチ（bench-schedule.yml）の REQ-1/NFR-1 退行・計測不能・判定不能検知（イシュー #285、#614）"
          search-query: bench-regression
          title: ${{ steps.issue_body.outputs.title }}
          body-file: ${{ runner.temp }}/bench-pair-issue-body.md

      - name: 判定結果でジョブを終了（フェイルクローズ）
        if: always()
        env:
          REF_OUTCOME: ${{ steps.ref.outcome }}
          REF_RESOLVED: ${{ steps.ref.outputs.resolved }}
          PAIR_STATUS: ${{ steps.pair.outputs.status }}
          PAIR_OUTCOME: ${{ steps.pair.outcome }}
        run: |
          # `ref` ステップが skip された場合（前段の checkout / rustup 導入 /
          # oha 導入 / cur バイナリビルドの失敗）は `REF_RESOLVED` が空文字になり、
          # 「参照コミット未解決」（下の分岐）と誤認しうる。ジョブは前段の失敗により
          # 既に failure 状態のため、ここでは判定結果が存在しない旨を明示して
          # 1 で終了するに留め、誤った BLOCKED（終了コード 2）理由を出さない
          # （cursor[bot] レビュー指摘対応、週次 bench-accept ジョブの
          # `BENCH_OUTCOME != 'success'` ガードと同一パターン）。
          if [ "${REF_OUTCOME}" != "success" ]; then
            echo "参照コミット解決ステップが実行されていません（前段の checkout / toolchain / oha 導入 / cur バイナリビルドいずれかの失敗等）。判定結果を反映できないため終了します" >&2
            exit 1
          fi
          if [ "${REF_RESOLVED:-false}" != "true" ]; then
            echo "参照コミット未解決のため BLOCKED（終了コード 2）として扱います" >&2
            exit 2
          fi
          if [ "${PAIR_OUTCOME}" != "success" ] || [ -z "${PAIR_STATUS}" ]; then
            echo "bench-pair.sh は実行されていません（前段ステップの失敗等）。判定結果を反映できないため終了します" >&2
            exit 1
          fi
          echo "bench-pair.sh 終了コード: ${PAIR_STATUS}"
          exit "${PAIR_STATUS}"
