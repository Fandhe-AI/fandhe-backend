[package]
name = "fandhe-backend-plugin-openapi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fandhe-backend の OpenAPI ドキュメント生成プラグイン（TASK-3.1）。実装本体（crates/routes 等）とは疎結合な「ドキュメント専用関数」に utoipa::path を付与し ApiDoc に集約する（docs/spec/03-poc/openapi-generation の PoC-4 で検証・採用した方式）。"
# イシュー #94 の公開判断に基づき `publish = false` を解除済み。
# 公開手順は docs/design/crates-io-release.md を参照。
readme = "../../README.md"
keywords = ["openapi", "swagger", "documentation", "utoipa", "web"]
categories = ["web-programming", "development-tools"]

# workspace の lint 既定（unsafe_code / missing_docs を warn）を継承する
# （.claude/rules/coding-rust.md・.claude/rules/security.md）。
[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）: 本クレートは
# 独立クレート = プラグイン境界として切り出す。core / http / routes / 他プラグインの
# どこからも参照されない限り、utoipa 系依存は本クレートを明示的に依存に加えたときのみ
# `cargo tree` に現れる。workspace 内クレートへの依存は持たない
# （PoC-4 の統合方式をそのまま踏襲、docs/spec/03-poc/openapi-generation/README.md）。
# サーバ側 feature（`openapi = ["dep:fandhe-backend-plugin-openapi"]` 相当）による配線は
# TASK-2.1（#18）に接続点を委ねる（本クレート単体では未接続）。
[dependencies]
utoipa = { version = "5", default-features = true }
serde = { version = "1", features = ["derive"] }

# イシュー #320（`custom.rs::OpenApiDoc::from_json` の JSON 構文検証）で通常
# 依存へ変更した。従来は `gen-cli` feature 限定の optional 依存だったが、
# `utoipa`（上記、常に有効）が推移的に `serde_json` を引き込むため、通常
# 依存化しても `cargo tree` 上の推移依存差はゼロ（`docs/dep-impact/records.md`
# に証跡を記録）。pay-for-what-you-use は「feature 無効時に依存が増えない
# こと」を要求するのであって「常時有効な依存を持たないこと」は要求しない
# （`.claude/rules/pay-for-what-you-use.md`）ため、この変更は同原則に反しない。
serde_json = "1"

# gen-openapi CLI（TASK-3.2、#31。YAML 生成は #279）: `ApiDoc::openapi()` を
# JSON/YAML にシリアライズし crates/plugin-openapi/openapi.json・openapi.yaml
# （embed.rs から include_str! で埋め込む実体）を生成・検証する開発用バイナリ。
# サーバー本体ビルドの通常経路には一切含まれない（required-features に
# よりデフォルトでは cargo build 対象外）。
#
# `utoipa/yaml`（serde_norway 依存を引き込む）は本 feature に限定して有効化する。
# 仕様が名指しする YAML 変換手段の候補には serde_yaml もあったが、serde_yaml は
# unmaintained（RUSTSEC 情報勧告あり）のため、utoipa 公式の `yaml` feature が
# 使う保守フォーク serde_norway を採用した（`.claude/rules/security.md` A06）。
# `gen-cli` 無効時（サーバ側から lib として参照される通常経路）は feature
# 依存構文により utoipa/yaml も serde_norway も Cargo.lock 解決対象・
# `cargo tree` のいずれにも一切現れない
# （pay-for-what-you-use、`.claude/rules/pay-for-what-you-use.md`）。
[features]
gen-cli = ["utoipa/yaml"]

[[bin]]
name = "gen-openapi"
path = "src/bin/gen-openapi.rs"
required-features = ["gen-cli"]
