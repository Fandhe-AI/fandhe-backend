[package]
name = "fandhe-backend-plugin-tracing"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "backend-framework の可観測性（サンプリング付きトレーシング）プラグイン（TASK-10.1）。REQ-10 の PoC-10 実測（サンプリングなし構成で RPS 劣化 31.6%・p95 悪化 61.7%）を踏まえ、Middleware 拡張点上で一定割合のみ span/event を記録する。"
publish = false

# workspace の lint 既定（unsafe_code / missing_docs を warn）を継承する
# （.claude/rules/coding-rust.md・.claude/rules/security.md）。
[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）: 本クレートは
# `crates/core` に依存しない（コア → 本クレートの optional 依存という単方向の
# エッジのみを許すため、循環依存を避ける設計上の要件。`fandhe-backend-plugin-websocket` と
# 同一パターン、docs/design/plugin-boundary.md 6.1 節・crates/core/src/server.rs
# の doc を参照）。`Middleware` trait を実装するアダプタはコア側（crates/core）に
# 置き、本クレートは純粋なサンプリング判定・記録関数 + 設定型 + 初期化ヘルパー
# のみを公開する。
#
# 依存は次の 3 つに限定する:
# - `fandhe-backend-http`: `RequestHead` の参照のみ（記録フィールド method・path の取得元）
# - `tracing`: span/event マクロによる構造化記録の実体
# - `tracing-subscriber`: `fmt` レイヤ（既定の記録先。`registry` feature で他レイヤと
#   合成可能にする）
# - `tracing-appender`: `non_blocking` writer。AGENTS.md「規約: ミドルウェア非同期
#   I/O 必須化」に従い、既定で非同期・バッファ済み I/O とするための実体
[dependencies]
fandhe-backend-http = { path = "../http" }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "registry",
  "std",
] }
tracing-appender = { version = "0.2", default-features = false }
