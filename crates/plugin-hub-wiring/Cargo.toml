[package]
name = "fandhe-backend-plugin-hub-wiring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fandhe-backend の hub 共通配線プラグイン（TASK-9.1 / TASK-9.2）。コアの RequestGate 拡張点上に TenantGate を実装し、汎用 JWT 検証クレート（fandhe-backend-plugin-jwt）による検証 → org_id 抽出 → フェイルクローズの配線を集約する。"
# イシュー #94 の公開判断に基づき `publish = false` を解除済み。
# 公開手順は docs/design/crates-io-release.md を参照。
readme = "../../README.md"
keywords = ["jwt", "jwks", "authentication", "web", "plugin"]
categories = ["authentication", "web-programming"]
# テスト専用 RSA 鍵フィクスチャ（tests/fixtures/*.pk8）は crates.io 公開物に
# 同梱する。src/（`#[cfg(test)]`）・tests/・examples/ が `include_bytes!` で
# コンパイル時に参照しており、除外すると公開版クレートの cargo test・
# examples ビルドがコンパイル不能になるため（PR #350 Bugbot 指摘）。
# 鍵は tests/fixtures/README.md に「テスト専用・秘匿性なし・本番使用禁止」と
# 明記された公開前提のフィクスチャであり、シークレット混入防止
# （.claude/rules/security.md）の対象となる実運用鍵ではない。

# workspace の lint 既定（unsafe_code / missing_docs を warn）を継承する
# （.claude/rules/coding-rust.md・.claude/rules/security.md）。
[lints]
workspace = true

# 依存逆転型プラグイン（.claude/rules/pay-for-what-you-use.md・
# docs/design/plugin-boundary.md「Gate 型パターン」節）: 既存 4 プラグイン
# （コア → プラグインの optional 依存 + feature ゲート）とは逆に、本クレートは
# コア（fandhe-backend-core）へ一方向に依存し、コア側の Cargo.toml・
# server.rs・plugin.rs は一切変更しない。利用側サービスが本クレートを依存に
# 加え `Server::gate(TenantGate::new(config))` で登録する。
#
# JWT/JWKS の検証（署名・iss・aud・typ・exp・nbf・鍵集合・検証結果キャッシュ）は
# 汎用 JWT 検証クレート `fandhe-backend-plugin-jwt`（REQ-16）へ一本化した
# （イシュー #820、`docs/design/jwt-verify-plugin.md` 2.9 節）。本クレートは
# `org_id` 抽出・テナント境界・Outbox・同意ゲート・監査のみを担い、暗号処理は
# 持たない。plugin → plugin の依存は `scripts/dep-direction-check.sh` に明示した
# 唯一の例外。workspace 内クレートのため Cargo.lock に新しい crate・版は増えない。
# `serde` は `HubClaims`（追加クレーム `org_id`）の derive、`serde_json` は
# `audit` モジュールのログ直列化に使う。
[dependencies]
fandhe-backend-core = { workspace = true }
fandhe-backend-http = { workspace = true }
fandhe-backend-plugin-jwt = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# 統合テスト（tests/tenant_gate.rs・tests/hub_acceptance.rs）で
# `handle_connection` を `tokio::io::duplex` 越しに駆動する E2E 確認、および
# 受け入れ検証用ダミー hub サービス（examples/hub_service_demo.rs、TASK-9.5 /
# #65）でのみ使用。本体ビルド（src/**）には影響しない（`crates/core/Cargo.toml`・
# `crates/plugin-graphql/Cargo.toml` の dev-dependencies と同型のパターン）。
# `fandhe-backend-routes` は `examples/hub_service_demo.rs` が PoC-6 相当の 3 エンドポイント
# ルーティングを組み立てるためだけに使う（`crates/core/examples/minimal.rs` と
# 同一パターン）。
[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "io-util",
] }
fandhe-backend-routes = { path = "../routes" }
# テスト・example のトークン署名（RS256）と JWKS 組み立てにのみ使う（src/** は暗号を持たない）。
ring = { workspace = true }
base64 = { workspace = true }
