[package]
name = "fandhe-backend-plugin-hub-wiring"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fandhe-backend の hub 共通配線プラグイン（TASK-9.1 / TASK-9.2）。コアの RequestGate 拡張点上に TenantGate を実装し、RS256 + JWKS による JWT 検証 → org_id 抽出 → フェイルクローズの配線を集約する。"
# イシュー #94 の公開判断に基づき `publish = false` を解除済み。
# 公開手順は docs/design/crates-io-release.md を参照。
readme = "../../README.md"
keywords = ["jwt", "jwks", "authentication", "web", "plugin"]
categories = ["authentication", "web-programming"]
# テスト専用 RSA 鍵フィクスチャ（tests/fixtures/README.md 参照。秘匿性はない）を
# crates.io 公開物に同梱しない。「秘密鍵ファイルを公開物へ含めない」原則を
# 機械的に守る安全側の除外で、ローカル・CI の cargo test には影響しない
# （.claude/rules/security.md）。
exclude = ["tests/fixtures/*.pk8"]

# workspace の lint 既定（unsafe_code / missing_docs を warn）を継承する
# （.claude/rules/coding-rust.md・.claude/rules/security.md）。
[lints]
workspace = true

# 依存逆転型プラグイン（.claude/rules/pay-for-what-you-use.md・
# docs/design/plugin-boundary.md「Gate 型パターン」節）: 既存 4 プラグイン
# （コア → プラグインの optional 依存 + feature ゲート）とは逆に、本クレートは
# コア（fandhe-backend-core）へ一方向に依存し、コア側の Cargo.toml・
# server.rs・plugin.rs は一切変更しない。利用側サービスが本クレートを依存に
# 加え `Server::gate(TenantGate::new(config))` で登録する。
#
# JWT (RS256) 検証は ring（定数時間比較の RSA PKCS#1 v1.5 検証を内蔵）、
# base64url デコードは base64、JWKS / クレーム JSON の厳密パースは serde +
# serde_json を用いる（手書き RSA 演算・JSON パースによるタイミング攻撃・
# 堅牢性リスクを回避、.claude/rules/security.md）。
#
# `rsa`（RustCrypto）ではなく `ring` を採用する理由: `rsa` crate は
# RUSTSEC-2023-0071（Marvin attack、fix なし）を抱えており `scripts/dep-audit.sh`
# （`deny.toml` advisories.ignore = [] のフェイルクローズ運用）で確実に FAIL
# する。`ring` は `crates/plugin-webrtc`（`webrtc` feature 経由）が既に
# 依存グラフへ引き込んでいる実績依存（`deny.toml` のライセンス許可リストに
# ISC 等が既存）であり、新規のライセンス・advisory 面の追加リスクがない。
# 使わないサービスはこれらの依存を一切引き込まない（`cargo tree
# -p fandhe-backend-core` に本クレート・本依存が現れないことで
# pay-for-what-you-use を機械検証できる）。
[dependencies]
fandhe-backend-core = { path = "../core", version = "0.1.0" }
fandhe-backend-http = { path = "../http", version = "0.1.0" }
ring = "0.17"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 統合テスト（tests/tenant_gate.rs・tests/hub_acceptance.rs）で
# `handle_connection` を `tokio::io::duplex` 越しに駆動する E2E 確認、および
# 受け入れ検証用ダミー hub サービス（examples/hub_service_demo.rs、TASK-9.5 /
# #65）でのみ使用。本体ビルド（src/**）には影響しない（`crates/core/Cargo.toml`・
# `crates/plugin-graphql/Cargo.toml` の dev-dependencies と同型のパターン）。
# `fandhe-backend-routes` は `examples/hub_service_demo.rs` が PoC-6 相当の 3 エンドポイント
# ルーティングを組み立てるためだけに使う（`crates/core/examples/minimal.rs` と
# 同一パターン）。
[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "io-util",
] }
fandhe-backend-routes = { path = "../routes" }
