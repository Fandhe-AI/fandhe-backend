[package]
name = "fandhe-backend-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fandhe-backend の最小コア。HTTP/1.1 サーバ・3 種拡張点（Middleware / UpgradeHandler / RequestGate）・Cargo feature 駆動のプラグイン配線を提供する。"
# イシュー #94 の公開判断に基づき `publish = false` を解除済み。
# 公開手順は docs/design/crates-io-release.md を参照。
readme = "../../README.md"
keywords = ["http", "server", "web", "framework", "async"]
categories = ["web-programming", "web-programming::http-server", "network-programming", "asynchronous"]

[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）:
# コアは重い依存を持ち込まない。workspace 内クレートのほか、コアループ
# （接続受理・リクエストループ、TASK-1.4-2 / #70）が必要とする最小限の tokio
# feature のみを追加する。fandhe-backend-http は sans-IO な HTTP/1.1 パーサ
# （crates/http、TASK-1.3）を提供する下位層であり、依存方向は
# server → routes → http::* の一方向（TASK-1.5 で機械的保証）に従う。
#
# tokio の feature は次の 5 つに限定する（`cargo tree -p fandhe-backend-core`
# でこれ以外の重い依存が増えていないことを確認する）:
# - `rt` / `net`: TCP リスナーと非同期ランタイム（接続受理ループ本体）
# - `io-util`: fandhe-backend-http::connection::read_request が要求する AsyncRead/AsyncWrite
# - `time`: 読み取りタイムアウト（スロークライアント対策、.claude/rules/security.md）
# - `sync`: accept ループの同時接続数上限（`tokio::sync::Semaphore`、
#   リソース枯渇 DoS 対策、.claude/rules/security.md）
#
# fandhe-backend-routes（crates/routes、TASK-1.5 / #14）は依存方向グラフ上のエッジ
# `server → routes` を実体化する唯一の workspace 内依存追加。外部 crates.io
# 依存はここでも増えない（fandhe-backend-routes 自体が fandhe-backend-http のみに依存する中間層）。
[dependencies]
fandhe-backend-http = { workspace = true }
fandhe-backend-routes = { workspace = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }

# TASK-2.1（#18）: `webrtc-proxy` feature 有効時のみ依存として解決される
# プラグイン境界の第 1 号（`optional = true` + `dep:` 構文、
# .claude/rules/pay-for-what-you-use.md）。`dep:fandhe-backend-plugin-webrtc-proxy` は
# implicit feature（`fandhe-backend-plugin-webrtc-proxy` という名前の feature が暗黙に
# 生えてしまう挙動）を作らず、`webrtc-proxy` feature 名だけを公開 API とする。
# feature 無効時は `cargo tree -p fandhe-backend-core` に本行の依存が
# 一切現れない（`docs/design/plugin-boundary.md` の検証コマンドを参照）。
fandhe-backend-plugin-webrtc-proxy = { workspace = true, optional = true }

# TASK-8.1（#26）: in-process WebRTC プラグイン（`webrtc-rs` 直接依存）。
# `webrtc-proxy`（上記、別プロセス切り出し型）とはクレート境界で完全に分離しており、
# `webrtc` feature 無効時は `cargo tree -p fandhe-backend-core` に本行の依存が
# 一切現れない（TASK-2.1 と同一のプラグイン境界パターン、
# .claude/rules/pay-for-what-you-use.md）。
fandhe-backend-plugin-webrtc = { workspace = true, optional = true }

# TASK-4.1（#22）: `websocket` feature 有効時のみ依存として解決される
# Upgrade 型プラグインの第 1 号。`fandhe-backend-plugin-websocket` は循環依存を避けるため
# `fandhe-backend-core` に依存しない（`crates/plugin-websocket/src/lib.rs`
# の doc・`docs/design/plugin-boundary.md` 6.1 節を参照）。`UpgradeHandler`
# trait を実装するアダプタはコア側（`crates/core/src/server.rs`）に置く。
fandhe-backend-plugin-websocket = { workspace = true, optional = true }

# TASK-2.4（#21）で確立した第 2 のパスインターセプト型プラグイン境界
# インスタンス（REQ-2「少なくとも 2 種のプラグインを feature flag で着脱
# できる」実証）を、TASK-5.1（#38）で `async-graphql` による実クエリ実行へ
# 差し替えた（`crates/plugin-graphql` の doc を参照）。`async-graphql` の
# 推移的依存（PoC 実測 +95 クレート）は本クレートの内部にのみ現れ、
# webrtc-proxy と同じく `dep:` 構文で feature 無効時は本行ごと依存グラフ
# から完全除外される。
fandhe-backend-plugin-graphql = { workspace = true, optional = true }

# TASK-10.1（#56）: `tracing` feature 有効時のみ依存として解決される可観測性
# プラグイン。`fandhe-backend-plugin-websocket` と同一の非循環パターンで
# `fandhe-backend-core` に依存しない（`crates/plugin-tracing/src/lib.rs`
# の doc・`docs/design/plugin-boundary.md` 6.1 節を参照）。`Middleware` trait を
# 実装するアダプタ（`TracingMiddleware`）はコア側（`crates/core/src/server.rs`）
# に置く。`tracing` feature 無効時は `cargo tree -p fandhe-backend-core` に
# 本行の依存（および推移的な `tracing` / `tracing-subscriber` / `tracing-appender`）
# が一切現れない。
fandhe-backend-plugin-tracing = { workspace = true, optional = true }

# TASK-2.1（#256、REQ-3 の核心接続点）: `openapi` feature 有効時のみ依存として
# 解決される、`GET /openapi.json` 静的サービング用プラグイン。`webrtc-proxy` /
# `graphql` と同じパスインターセプト型パターンだが、プラグイン側はハンドラを
# 持たず定数 `OPENAPI_JSON` を公開するのみ（`crates/plugin-openapi/src/embed.rs`
# の接続契約を参照）。コア側（`crate::plugin::try_intercept`）が
# `Content-Type: application/json` を付けて返す薄いハンドラを実装する。
# feature 無効時は `cargo tree -p fandhe-backend-core` に本行の依存（および
# 推移的な `utoipa` 系）が一切現れない。
fandhe-backend-plugin-openapi = { workspace = true, optional = true }

# イシュー #305（REQ-3 の CORS 実証）: `cors` feature 有効時のみ依存として
# 解決される「レスポンス後処理型」プラグイン境界の第 1 号（`Middleware` /
# `UpgradeHandler` / `RequestGate` のいずれにも載らない新パターン、
# `docs/design/plugin-boundary.md` の新節・`crates/plugin-cors/src/lib.rs`
# の doc を参照）。`fandhe-backend-plugin-websocket` と同一の非循環パターンで
# `fandhe-backend-core` に依存しない。feature 無効時は
# `cargo tree -p fandhe-backend-core` に本行の依存が一切現れない。
fandhe-backend-plugin-cors = { workspace = true, optional = true }

# イシュー #321（レスポンス圧縮）: `compression` feature 有効時のみ依存として
# 解決される「レスポンス後処理型」プラグイン境界の第 2 インスタンス
# （`plugin-cors` が確立したパターンを踏襲、`docs/design/plugin-boundary.md`
# の該当節・`crates/plugin-compression/src/lib.rs` の doc を参照）。
# `fandhe-backend-plugin-cors` と同一の非循環パターンで `fandhe-backend-core`
# に依存しない。feature 無効時は `cargo tree -p fandhe-backend-core` に
# 本行の依存（`flate2` 系推移的依存を含む）が一切現れない。
fandhe-backend-plugin-compression = { workspace = true, optional = true }

# イシュー #318: `static` feature 有効時のみ依存として解決される、パス
# インターセプト型の静的ファイル配信プラグイン。`graphql`・`openapi` と同じ
# 設定登録型パターン（`Server::static_files()` 明示登録時のみ応答）。
# `fandhe-backend-plugin-websocket`・`fandhe-backend-plugin-cors` と同一の
# 非循環パターンで `fandhe-backend-core` に依存しない。feature 無効時は
# `cargo tree -p fandhe-backend-core` に本行の依存が一切現れない。
fandhe-backend-plugin-static = { workspace = true, optional = true }

# feature 命名規約（`docs/design/plugin-boundary.md`）: プラグインクレート名
# （`fandhe-backend-plugin-<name>`）から `fandhe-backend-plugin-` 接頭辞を除いた `<name>` を feature 名
# とする。`default = []` によりビルド時に何も選択しなければプラグインは
# コード・依存・unsafe とも一切バイナリに含まれない。
[features]
default = []
webrtc-proxy = ["dep:fandhe-backend-plugin-webrtc-proxy"]
# TASK-8.1（#26）。`webrtc-proxy` と同時に `--all-features` で有効化されても
# 依存グラフ上は独立（`crate::plugin::try_intercept` の doc・
# `docs/design/plugin-boundary.md` の優先順位の記述を参照）。
webrtc = ["dep:fandhe-backend-plugin-webrtc"]
websocket = ["dep:fandhe-backend-plugin-websocket"]
graphql = ["dep:fandhe-backend-plugin-graphql"]
tracing = ["dep:fandhe-backend-plugin-tracing"]
# TASK-2.1（#256）: `GET /openapi.json` 静的サービング（設定登録型、
# `Server::openapi()` で明示登録した場合のみ応答する opt-in）。
openapi = ["dep:fandhe-backend-plugin-openapi"]
# イシュー #305: CORS ヘッダ付与（`Server::cors()` で明示登録した場合のみ
# 実リクエスト応答へヘッダを付与する opt-in、他の設定登録型プラグインと
# 同一の「未登録時はフォールスルー」パターン）。
cors = ["dep:fandhe-backend-plugin-cors"]
# イシュー #321: レスポンス gzip 圧縮（`Server::compression(config)` で
# 明示登録した場合のみ実リクエスト応答を圧縮する opt-in、`cors` と同一の
# 「未登録時はフォールスルー」パターン）。
compression = ["dep:fandhe-backend-plugin-compression"]
# イシュー #318: 静的ファイル配信（`Server::static_files()` で明示登録した
# 場合のみ応答する opt-in、他の設定登録型プラグインと同一パターン）。
static = ["dep:fandhe-backend-plugin-static"]

# テスト専用（`#[tokio::test]` / `tokio::io::duplex` / マルチスレッドランタイム）。
# 本体ビルドの feature 集合には影響しない。`async-graphql` は
# `crates/core/tests/plugin_graphql_boundary.rs`（`#![cfg(feature = "graphql")]`
# でコンパイル自体を feature ゲート）がデモスキーマを組み立てるためだけに使う。
# `dynamic-schema` feature（`Schema::build` による実行時スキーマ構築 API）を
# 使い、`#[Object]` 派生マクロは使わない。`async-graphql-derive` の
# `#[Object]` は生成コードへ `#[allow(clippy::all, ...)]` を無条件付与し、
# `fandhe-backend-core`（コア crate。`.claude/rules/coding-rust.md` の
# 「コアに不要な `unsafe` を持ち込まない」対象そのもの）が継承する workspace
# の forbid lint（`docs/design/unsafe-deny-lints.md` 第 1 層）と衝突して
# `E0453` でビルド不能になるため（`crates/plugin-graphql` は自クレート限定で
# 同 lint を deny へ局所ダウングレードして回避しているが、コア crate 自体には
# 同じ緩和を適用しない。forbid 層の防御対象はコア自身のコードであり、コアの
# lint を下げてまで derive マクロを使う理由がないため）。dev-dependencies は
# release ビルドに一切含まれないため pay-for-what-you-use の対象外
# （`.claude/rules/pay-for-what-you-use.md`）。
#
# `signal` feature（イシュー #313、`examples/graceful_shutdown.rs` 専用）:
# `BoundServer::run_until` は shutdown シグナル源をコアで扱わず、利用者が
# 渡す `Future` として受け取る設計（tokio `signal` feature をコアの
# [dependencies] に持ち込まないための意図的な選択、pay-for-what-you-use）。
# 利用例を示すためだけに dev-dependencies 限定で追加し、本体ビルド
# （`cargo build -p fandhe-backend-core` / `--all-features` 問わず）の
# 依存グラフには一切現れない（`cargo tree -p fandhe-backend-core -e normal`
# で検証可能）。
[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "signal",
] }
async-graphql = { version = "7", default-features = false, features = ["dynamic-schema"] }
# `crates/core/tests/plugin_tracing_boundary.rs`（`#![cfg(feature = "tracing")]`
# でコンパイル自体を feature ゲート）が、記録された span/event 件数をサンプリング
# 間隔どおりに検証するためだけに使うテスト専用サブスクライバ層の実装に必要。
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
# TASK-1.6-3（#168）: `examples/core-bench.rs`（axum-ref 機能等価の性能計測用
# サーバ）専用。`/users/{id}` 応答・`/echo` の JSON パース/再シリアライズに使う。
# dev-dependencies は release ビルド・下流クレートに一切波及しないため
# pay-for-what-you-use の対象外（`cargo tree -p fandhe-backend-core -e normal`
# に現れないことで検証可能。上の async-graphql 追加時の既存コメントと同根）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `crates/core/tests/plugin_compression_boundary.rs`（`#![cfg(feature =
# "compression")]` でコンパイル自体を feature ゲート）が、gzip 圧縮された
# レスポンス body を解凍して元 body との同一性（応答同一性、受け入れ基準）
# を検証するためだけに使う。`fandhe-backend-plugin-compression` の
# `[dependencies]` に含まれるバージョンと揃える。dev-dependencies は
# release ビルドに一切含まれないため pay-for-what-you-use の対象外
# （上の async-graphql 追加時の既存コメントと同根）。
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# `examples/webrtc_nfr6.rs`（TASK-8.4 / #29）は `fandhe-backend-plugin-webrtc`（optional dep）を
# 直接使うため、`webrtc` feature 無効時に `cargo build --workspace --all-targets` 等が
# コンパイル対象へ含めて失敗しないよう `required-features` で明示的にゲートする
# （`examples/minimal.rs` は feature 非依存のため既定の自動検出のままでよい）。
[[example]]
name = "webrtc_nfr6"
required-features = ["webrtc"]

# `examples/graphql_nfr6.rs`（TASK-5.2 / #53）は `fandhe-backend-plugin-graphql`（optional dep）を
# 直接使うため、`graphql` feature 無効時に `cargo build --workspace --all-targets` 等が
# コンパイル対象へ含めて失敗しないよう `required-features` で明示的にゲートする
# （`webrtc_nfr6` と同一パターン）。
[[example]]
name = "graphql_nfr6"
required-features = ["graphql"]

# `examples/tracing_nfr.rs`（TASK-10.4 / #59）は `fandhe-backend-plugin-tracing`（optional dep）を
# 直接使うため、`tracing` feature 無効時に `cargo build --workspace --all-targets` 等が
# コンパイル対象へ含めて失敗しないよう `required-features` で明示的にゲートする
# （`webrtc_nfr6` / `graphql_nfr6` と同一パターン）。
[[example]]
name = "tracing_nfr"
required-features = ["tracing"]

# `examples/ws_echo.rs`（TASK-4.3 / #24）は `fandhe-backend-plugin-websocket::WebSocketConfig` を
# 直接使うため、`websocket` feature 無効時に `cargo build --workspace --all-targets` 等が
# コンパイル対象へ含めて失敗しないよう `required-features` で明示的にゲートする
# （`webrtc_nfr6` / `graphql_nfr6` / `tracing_nfr` と同一パターン）。
[[example]]
name = "ws_echo"
required-features = ["websocket"]

# `examples/ws_nfr6.rs`（TASK-4.4 / #25）は `fandhe-backend-plugin-websocket::WebSocketConfig` を
# 直接使うため、`websocket` feature 無効時に `cargo build --workspace --all-targets` 等が
# コンパイル対象へ含めて失敗しないよう `required-features` で明示的にゲートする
# （`webrtc_nfr6` / `graphql_nfr6` / `tracing_nfr` / `ws_echo` と同一パターン）。
# `ws_echo`（`#[tokio::main(flavor = "multi_thread")]`、TASK-4.3 の 10,000 同時接続
# 負荷試験専用）とは別に `current_thread` ランタイムの専用 example を用意する理由:
# NFR-6 比較対象の `examples/minimal.rs`（ベースライン、`current_thread`）と
# ランタイムのスレッド数を揃えないと、RPS 差が feature の実処理コストではなく
# 「シングルスレッド vs マルチスレッド」というランタイム構成の違いに支配されてしまう
# （`ws_echo` をそのまま NFR-6 比較に流用した際に実測で判明。RPS 比が baseline 比
# 約190% となった原因。`benches/reports/task-4.4-ws-latency.md` 参照）。
[[example]]
name = "ws_nfr6"
required-features = ["websocket"]

# `examples/cors_demo.rs`（イシュー #305）は `fandhe-backend-plugin-cors`（optional dep）を
# 直接使うため、`cors` feature 無効時に `cargo build --workspace --all-targets` 等が
# コンパイル対象へ含めて失敗しないよう `required-features` で明示的にゲートする
# （`webrtc_nfr6` / `graphql_nfr6` / `tracing_nfr` / `ws_echo` / `ws_nfr6` と同一パターン）。
[[example]]
name = "cors_demo"
required-features = ["cors"]

# `examples/compression_demo.rs`（イシュー #321）は `fandhe-backend-plugin-compression`
# （optional dep）を直接使うため、`compression` feature 無効時に
# `cargo build --workspace --all-targets` 等がコンパイル対象へ含めて失敗
# しないよう `required-features` で明示的にゲートする（`cors_demo` 等と
# 同一パターン）。
[[example]]
name = "compression_demo"
required-features = ["compression"]

# `examples/compression_blocking_micro_bench.rs`（イシュー #468）は
# `fandhe_backend_plugin_compression::compress_body`（optional dep 経由）を
# 直接使うため、`compression` feature 無効時に `cargo build --workspace
# --all-targets` 等がコンパイル対象へ含めて失敗しないよう
# `required-features` で明示的にゲートする（`compression_demo` と同一
# パターン。production コード変更を含まない計測専用 example、
# `benches/compression-blocking-bench.sh` から呼ばれる）。
[[example]]
name = "compression_blocking_micro_bench"
required-features = ["compression"]

# `examples/compression_e2e_bench.rs`（イシュー #473）は
# `fandhe_backend_plugin_compression::CompressionConfig`（optional dep 経由）を
# 直接使うため、`compression` feature 無効時に `cargo build --workspace
# --all-targets` 等がコンパイル対象へ含めて失敗しないよう
# `required-features` で明示的にゲートする（`compression_demo`・
# `compression_blocking_micro_bench` と同一パターン。production コード
# 変更を含まない計測専用 example、`benches/compression-e2e-bench.sh` から
# 呼ばれる）。
[[example]]
name = "compression_e2e_bench"
required-features = ["compression"]

# `examples/static_demo.rs`（イシュー #318）は `fandhe-backend-plugin-static`（optional dep）を
# 直接使うため、`static` feature 無効時に `cargo build --workspace --all-targets` 等が
# コンパイル対象へ含めて失敗しないよう `required-features` で明示的にゲートする
# （`webrtc_nfr6` / `graphql_nfr6` / `tracing_nfr` / `ws_echo` / `ws_nfr6` / `cors_demo` と同一パターン）。
[[example]]
name = "static_demo"
required-features = ["static"]

# TASK-1.6-3（#168）: `examples/core-bench.rs`（axum-ref 機能等価の性能計測用
# サーバ）。`test = true` により `cargo test` / nextest が本 example 内の
# `#[cfg(test)] mod tests`（axum-ref との等価性テスト）を実行対象に含める
# （既定では `[[example]]` 配下のテストは `cargo test` の対象に自動で含まれない）。
# feature 非依存（`required-features` 不要。`webrtc_nfr6` 等とは異なりオプション
# 依存プラグインを使わない）。
[[example]]
name = "core-bench"
test = true

# イシュー #257（REQ-3）: `examples/openapi_endpoints.rs`（ApiDoc 対象 5 エンドポイント
# の実サービング）。`core-bench` と同一理由で `test = true` により
# `#[cfg(test)] mod tests`（5 エンドポイント × 正常系/400 系）を `cargo test` の対象に含める。
# feature 非依存（`fandhe_backend_routes::Router::route_param` は crates/routes 本体の
# 公開 API であり、オプション依存プラグインを使わない）。
[[example]]
name = "openapi_endpoints"
test = true

# イシュー #320: `examples/openapi_custom_doc.rs`（利用者アプリ独自 OpenAPI
# スキーマ登録サンプル）。`Server::openapi_with` が `fandhe-backend-plugin-openapi`
# （optional dep）の `OpenApiDoc` 型を直接使うため、`openapi` feature 無効時に
# `cargo build --workspace --all-targets` 等がコンパイル対象へ含めて失敗しない
# よう `required-features` で明示的にゲートする（`webrtc_nfr6` 等と同一
# パターン）。`test = true` により `#[cfg(test)] mod tests`（登録済み JSON 配信・
# yaml 未登録 404・無関係パスのフォールスルー）を `cargo test` の対象に含める
# （`core-bench` / `openapi_endpoints` と同一理由）。
[[example]]
name = "openapi_custom_doc"
required-features = ["openapi"]
test = true
