[package]
name = "backend-framework-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "backend-framework の最小コア（HTTP/1.1・3 種拡張点）。TASK-1.3 以降で実体を追加する"

[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）:
# コアは重い依存を持ち込まない。workspace 内クレートのみを依存とし、外部
# crates.io 依存はゼロを維持する。bf-http は sans-IO な HTTP/1.1 パーサ
# （crates/http、TASK-1.3）を提供する下位層であり、依存方向は
# server → routes → http::* の一方向（TASK-1.5 で機械的保証）に従う。
[dependencies]
bf-http = { path = "../http" }
