[package]
name = "bf-routes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "backend-framework の最小ルータ（method + target 完全一致）。TASK-1.5 で server→routes→http::* の依存方向を実体化する。"
publish = false

[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）:
# 本クレートは依存方向グラフの中間層であり、下位層 bf-http（crates/http）にのみ
# 依存する。workspace 内クレート以外の外部依存は持たない（Router の内部状態は
# 標準ライブラリの Vec のみで足りるため）。`cargo tree -p bf-routes` で
# bf-http 以外の依存が増えていないことを確認する。
[dependencies]
bf-http = { path = "../http" }
