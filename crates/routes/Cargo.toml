[package]
name = "fandhe-backend-routes"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fandhe-backend のルータ（静的・パスパラメータ・ワイルドカード・フォールバック・async ハンドラ対応）。fandhe-backend-http にのみ依存する中間層。"
# イシュー #94 の公開判断に基づき `publish = false` を解除済み。
# 公開手順は docs/design/crates-io-release.md を参照。
readme = "../../README.md"
keywords = ["router", "routing", "http", "web", "framework"]
categories = ["web-programming", "web-programming::http-server", "asynchronous"]

[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）:
# 本クレートは依存方向グラフの中間層であり、下位層 fandhe-backend-http（crates/http）にのみ
# 依存する。workspace 内クレート以外の外部依存は持たない（Router の内部状態は
# 標準ライブラリの Vec のみで足りるため）。`cargo tree -p fandhe-backend-routes` で
# fandhe-backend-http 以外の依存が増えていないことを確認する。
[dependencies]
fandhe-backend-http = { path = "../http", version = "0.2.0" }

# dev-only（イシュー #315）: async ハンドラ契約（`Router::route_async` /
# `route_param_async`）の doc test・統合テストで `Future` を駆動するためだけに
# 使う。normal 依存グラフには一切現れないため pay-for-what-you-use に反しない
# （`cargo tree -p fandhe-backend-routes -e normal` で確認）。`rt` + `macros` の
# みに絞り、`crates/core` の tokio 依存（本体機能）とは独立。
[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
