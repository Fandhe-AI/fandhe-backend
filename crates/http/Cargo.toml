[package]
name = "bf-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "backend-framework の最小 HTTP/1.1 コア（自前パーサ）。pay-for-what-you-use の起点として外部依存を持たない。"
publish = false

# workspace の lint 既定（unsafe_code / missing_docs を warn）を継承する。
# CI の `cargo clippy -- -D warnings` と組み合わせて実質 deny として機能する
# （.claude/rules/coding-rust.md・.claude/rules/security.md）。
[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）: I/O 層は本クレートの
# 唯一の実行時依存として tokio を追加するが、`io-util`（AsyncRead/AsyncReadExt のみ）に
# 限定する。`net`/`rt`/`macros` 等は有効化しない — 実ソケットへの接続・ランタイム起動は
# TASK-1.4（#13）の接続受理ループが担い、本クレートは `AsyncRead + Unpin` の汎用実装に
# とどめるため。`cargo tree -p bf-http` で tokio 以外の依存が増えていないことを確認する。
[dependencies]
tokio = { version = "1", default-features = false, features = ["io-util"] }

# テスト専用（`#[tokio::test]` / `tokio::io::duplex` / `tokio::time::timeout`）。
# `time` は統合テスト（tests/http_flow.rs）でハング検知用のテスト内タイムアウトに
# 使うのみで、本体ビルド・feature 無効時の依存グラフには一切影響しない。
[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "time"] }
