[package]
name = "fandhe-backend-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fandhe-backend の HTTP/1.1 プリミティブ（sans-IO パーサ・レスポンス構築・chunked / query / form / cookie 各パーサ）。"
# イシュー #94 の公開判断に基づき `publish = false` を解除済み。
# 公開手順は docs/design/crates-io-release.md を参照。
readme = "../../README.md"
keywords = ["http", "parser", "server", "web", "framework"]
categories = ["web-programming", "web-programming::http-server", "network-programming", "asynchronous"]

# workspace の lint 既定（unsafe_code / missing_docs を warn）を継承する。
# CI の `cargo clippy -- -D warnings` と組み合わせて実質 deny として機能する
# （.claude/rules/coding-rust.md・.claude/rules/security.md）。
[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）: 本クレートの必須実行時
# 依存は tokio + memchr の 2 件。tokio は I/O 層として既定で `io-util`
# （AsyncRead/AsyncReadExt・`read_buf` 用の内包 `bytes` BufMut 実装のみ）に限定する。
# `net`/`rt`/`macros` は既定で有効化しない — 実ソケットへの接続・ランタイム起動は
# TASK-1.4（#13）の接続受理ループが担い、本クレートは `AsyncRead + Unpin` の汎用実装に
# とどめるため。`cargo tree -p fandhe-backend-http` で tokio・memchr 以外の依存が
# 増えていないことを確認する。
[dependencies]
tokio = { version = "1", default-features = false, features = ["io-util"] }

# リクエストヘッド終端（`\r\n\r\n`）・ヘッダ行区切り（`\r\n`）探索を SIMD 最適化された
# memmem に委譲する（イシュー #586）。`default-features = false` により推移的依存
# ゼロ（no_std・alloc 不要な `memmem::find` のみ使用）。workspace 内に既存の
# axum-ref・plugin-graphql・plugin-webrtc・plugin-websocket 経由で同一バージョン
# （2.8.3）が既に解決されており、本クレートでの新規追加によるバージョン解決の
# 増加はない。採否根拠・依存インパクト実測値は docs/dep-impact/records.md 参照。
memchr = { version = "2.8", default-features = false }

# オプション feature `net`（既定 off）: `TCP_NODELAY` 設定（[`socket`] モジュール）に
# 限定して tokio `net` を有効化する。feature 無効時は `socket` モジュール自体が
# `#[cfg(feature = "net")]` でコンパイル対象外になり、`mio`/`socket2` 等の依存も
# `cargo tree -p fandhe-backend-http` に一切出ない（TASK-1.3-3 / #68）。
[features]
net = ["tokio/net"]

# テスト専用（`#[tokio::test]` / `tokio::io::duplex` / `tokio::time::timeout`）。
# `time` は統合テスト（tests/http_flow.rs）でハング検知用のテスト内タイムアウトに
# 使うのみ。ここでは `net` を明示的に列挙しない — resolver（`resolver = "3"`）の
# feature 統一により、本クレートの `net` feature（`tokio/net`）が有効な構成
# （`cargo test --features net`）では dev-dependencies の tokio にも自動的に
# `net` が伝播し、feature `net` 配下の統合テスト（実 `TcpListener` での
# `nodelay()` 検証）が動く。default 構成（`cargo tree -p fandhe-backend-http`）では `net`
# が有効化されないため `mio`/`socket2` は出ない
# （.claude/rules/pay-for-what-you-use.md）。
# `stats_alloc`（外部依存ゼロ・itself unsafe だが本クレート自体には `unsafe` を
# 一切導入しない）は `tests/alloc_count.rs`（イシュー #591 P0 対応、PR #602 レビュー
# 指摘）の `parse_request_head` alloc 回数計測専用。`GlobalAlloc` 実装は本クレート外の
# 依存内に閉じるため、workspace lint `unsafe_code = "warn"` を本クレートで緩める必要が
# ない（`.claude/rules/coding-rust.md`・`.claude/rules/security.md`）。dev-dependency の
# ためバイナリ・依存インパクトには影響しない（`.claude/rules/pay-for-what-you-use.md`）。
[dev-dependencies]
stats_alloc = "0.1.10"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "time"] }
