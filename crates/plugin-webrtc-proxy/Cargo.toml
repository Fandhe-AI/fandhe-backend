[package]
name = "fandhe-backend-plugin-webrtc-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fandhe-backend の WebRTC シグナリングプロキシプラグイン（TASK-8.2-2）。別プロセスに切り出した WebRTC サービスへ SDP Offer/Answer を中継し、webrtc-rs 系の巨大依存をコア・他プラグインの監査対象から隔離する。"
# イシュー #94 の公開判断に基づき `publish = false` を解除済み。
# 公開手順は docs/design/crates-io-release.md を参照。
readme = "../../README.md"
keywords = ["webrtc", "signaling", "proxy", "server", "plugin"]
categories = ["web-programming", "network-programming", "asynchronous"]

# workspace の lint 既定（unsafe_code / missing_docs を warn）を継承する
# （.claude/rules/coding-rust.md・.claude/rules/security.md）。
[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）: 本クレートは
# `crates/plugin-webrtc`（TASK-8.1、in-process 実装・webrtc-rs 依存）とは
# クレート境界で完全に分離する。依存は `fandhe-backend-http`（レスポンス構文検証の一部で
# 流用）と `tokio`（`net`/`io-util`/`time` のみ、`default-features = false`）
# に限定し、`webrtc-rs` 系クレートを一切含まない。`cargo tree -p
# fandhe-backend-plugin-webrtc-proxy` で `webrtc` 系依存が 0 件であることを継続的に確認する。
[dependencies]
fandhe-backend-http = { workspace = true }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time"] }

# 統合テスト（tests/proxy_e2e.rs）でモック上流サーバ・非同期テストランタイムを使うためのみ。
# 本体ビルド（lib.rs 以下）には影響しない。
[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
  "net",
  "io-util",
  "time",
  "macros",
  "rt-multi-thread",
] }
