[package]
name = "fandhe-backend-plugin-webrtc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fandhe-backend の in-process WebRTC プラグイン（TASK-8.1）。SDP Offer/Answer・データチャネル確立を webrtc-rs でプロセス内完結させる。REQ-8 の MVP 推奨（別プロセス切り出し、crates/plugin-webrtc-proxy）とは対照的な高攻撃表面の選択肢であり、クレート境界で完全に分離する。"
# イシュー #94 の公開判断に基づき `publish = false` を解除済み。
# 公開手順は docs/design/crates-io-release.md を参照。
readme = "../../README.md"
keywords = ["webrtc", "datachannel", "server", "web", "plugin"]
categories = ["web-programming", "network-programming", "asynchronous"]

# workspace の lint 既定（unsafe_code / missing_docs を warn）を継承する
# （.claude/rules/coding-rust.md・.claude/rules/security.md）。
[lints]
workspace = true

# pay-for-what-you-use（.claude/rules/pay-for-what-you-use.md）: 本クレートは
# `crates/plugin-webrtc-proxy`（TASK-8.2-2、別プロセス切り出し型）とはクレート
# 境界で完全に分離する。`webrtc`（0.17.1 系）は依存 +189 クレート・バイナリ
# サイズ約 10.4 倍・`unsafe` Functions 約 2.2 倍という桁違いの依存インパクトを
# 持つ（PoC-5、docs/spec の Conditional Go 条件(2)）ため、本クレート自体は
# `webrtc` feature（`crates/core/Cargo.toml` の `optional = true` + `dep:` 構文）
# 有効時にのみコアの依存グラフへ現れる（`cargo tree -p fandhe-backend-core`
# で検証）。
[dependencies]
fandhe-backend-http = { workspace = true }
webrtc = "0.17"
serde_json = "1"
# シグナリング全体タイムアウト（`WebRtcConfig::signaling_timeout`）のみに使う。
# 接続受理・I/O は webrtc クレート自身の tokio ランタイム利用に委ねる。
tokio = { version = "1", default-features = false, features = ["time"] }

# 統合テスト（tests/webrtc_datachannel.rs, tests/session_drain.rs 等）でループバック
# HTTP サーバ・クライアント側 RTCPeerConnection を動かすためのみ。本体ビルド
# （lib.rs 以下）には影響しない。
#
# `fandhe-backend-core`（`webrtc` feature 有効）を dev-dependency として追加し
# `Server`/`BoundServer::rebind_handle` 経由の実 rebind 配線を検証する e2e テスト
# （イシュー #498 レビュー対応）は一時 tests/rebind_force_close.rs として追加した
# ものの、`crates/core` の通常依存が本クレートを参照するため dev-dependency
# 追加は package レベルの循環になり、`cargo metadata`（`cargo geiger` 等が内部で
# 使う、workspace 全体を単一の resolve グラフとして解決するツール）では
# dev-dependency 経由の循環でも本クレートが常時コアの依存グラフへ現れてしまい
# pay-for-what-you-use 検証（`scripts/pay-for-what-you-use-check.sh` (c) cargo
# geiger 検証）を誤って FAIL させることが判明したため、該当テストと本依存を
# 削除した（`cargo build -p fandhe-backend-core --no-default-features` 自体は
# 汚染されないことを確認済みで実害はないが、検証ツールを偽陽性にする）。
# e2e カバレッジの再設計（root workspace から独立した standalone crate 化、
# `crates/http/fuzz` と同パターン）は別途 Issue で追跡する。
[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
  "net",
  "io-util",
  "time",
  "macros",
  "rt-multi-thread",
] }
