[package]
name = "fandhe-backend-plugin-jwt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "fandhe-backend の汎用 JWT 検証プラグイン（REQ-16）。RS256・ES256 の検証ポリシー（iss・aud・typ・許可 alg を必須とし、none・HS 系は型として表現不能）を提供する（RFC 8725・RFC 9068）。"
readme = "../../README.md"
keywords = ["jwt", "jwks", "authentication", "web", "plugin"]
categories = ["authentication", "web-programming"]

[lints]
workspace = true

# JWKS 鍵集合の解析（#814）に base64 / serde / serde_json を使う。版は hub-wiring と
# 同一（workspace 共有）で新しい crate・版を増やさない。ring は署名検証（#815）に
# 使う（RS256・ES256 の検証のみ。自前の暗号演算は持たない）。
#
# core / http は `RequestGate` 実装（#816、`JwtGate`）のために依存する（plugin → core の
# 一方向。core から本クレートへの辺は作らない）。workspace 内 crate のため
# Cargo.lock に新しい crate・版は増えない。
[dependencies]
fandhe-backend-core = { workspace = true }
fandhe-backend-http = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ring = { workspace = true }

# JWKS の取り直し（`jwks-refresh` feature、設計 `docs/design/jwt-verify-plugin.md` 8.2）。
# opt-in の optional 依存で、feature 無効時は本クレートから tokio への直接の通常依存辺を
# 持たない。`rt`・`macros` は使わない（crate 内で `tokio::spawn` も `tokio::select!` も
# 使わない）。`core` が既に `time`・`sync` を有効にしているため、有効化しても新しい
# パッケージも feature 集合の増加も生じない。
tokio = { version = "1", default-features = false, features = ["time", "sync"], optional = true }

[features]
default = []
# JWKS 取り直しの土台（取得関数の trait・設定型）。既定では無効。
jwks-refresh = ["dep:tokio"]

# 統合テスト（tests/gate.rs）が `handle_connection` を `tokio::io::duplex` 越しに駆動し、
# ハンドラの戻り値に `HandlerFuture` を使うためだけに必要（hub-wiring と同一パターン）。
[dev-dependencies]
tokio = { version = "1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
  "io-util",
  # `jwks-refresh` のタスクテスト（tests/refresh_task.rs）が仮想時間（`start_paused`）で
  # 周期・時間切れ・max_stale を決定的に検証するためだけに使う（dev 専用）。
  "test-util",
  "time",
  "sync",
] }
fandhe-backend-routes = { workspace = true }
